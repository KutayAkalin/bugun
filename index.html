n oluşacağını belirler.", "alinti": "\"Deneyimim, dikkat etmeyi kabul ettiğim şeydir.\" (<em>The Principles of Psychology<\/em>, 1890, bölüm XI 'Attention', s. 402; çeviri: Kutsi, James'in İngilizcesinden)", "bugun": "Bir saat boyunca tek bir işe tam dikkat ver ve dikkatin kaç kez kaydığını say.", "soru": "Dün en çok neye dikkat verdin ve bunu sen mi seçtin?", "kaynak": "<a href=\"https://psychclassics.yorku.ca/James/Principles/prin11.htm\" target=\"_blank\" rel=\"noopener\">Principles of Psychology, ch. XI, Classics in the History of Psychology<\/a>", "ask": "Bugünün felsefe notu: William James, “Dikkat deneyimi seçer”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F21", "title": "Absürt nedir?", "thinker": "Camus", "kim": "Albert Camus, 1913–1960, Cezayir doğumlu Fransız yazar ve filozof", "fikir": "Camus, <em>Sisifos Söyleni<\/em>'nde (1942) 'absürt'ü şöyle tanımlar: insanın anlam arama isteğiyle, bu isteğe cevap vermeyen dünya arasındaki uyumsuzluk. Stanford Felsefe Ansiklopedisi'ne göre ona göre bu dünya kendi içinde makul değildir ve absürt, aklın kendi sınırlarını net görmesidir. Camus bundan umuda kaçmayı değil, soruyu 'nasıl yaşanır?'a çevirmeyi seçer.", "alinti": "", "bugun": "Bir işi 'anlamı ne?' diye sormadan yap ve nasıl hissettirdiğine bak.", "soru": "Hangi sorunun cevabını bulmadan da yaşamayı sürdürebiliyorsun?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/camus/\" target=\"_blank\" rel=\"noopener\">SEP: Camus<\/a>", "ask": "Bugünün felsefe notu: Camus, “Absürt nedir?”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F07", "title": "Su gibi olmak", "thinker": "Laozi", "kim": "Laozi (Lao Tzu), tarihsel kişiliği tartışmalı, geleneksel olarak MÖ 6. yüzyıl; <em>Daodejing<\/em> (Tao Te Ching) adlı kitabın sahibi sayılır, Taoist (Dao, yani 'yol kçe, kısa, kaynak göster."}, {"id": "F01", "title": "Elindeki ve elinde olmayan", "thinker": "Epiktetos", "kim": "Epiktetos (Epictetus), MS 50–135 civarı, Stoacı (Stoa: Antik Yunan ve Roma'da soğukkanlılığı ve erdemi öğütleyen felsefe okulu)", "fikir": "Epiktetos, <em>Enchiridion<\/em>'da (yani 'El Kitabı'nda) işleri ikiye ayırır. Elimizde olanlar kendi kanaatlerimiz, isteklerimiz, kaçındıklarımız ve davranışlarımızdır. Elimizde olmayanlar bedenimiz, malımız, itibarımız ve makamımızdır. Dış şeyleri 'benim değil' diye görürsek kimse bizi zorlayamaz ve engelleyemez, der.", "alinti": "\"Bazı şeyler bizim elimizdedir, bazıları değil.\" (<em>Enchiridion<\/em> 1; çeviri: Kutsi, Elizabeth Carter'ın İngilizcesinden)", "bugun": "Canını sıkan bir şeyi aklında ikiye ayır: bu bende mi, değil mi? Sadece ilkine bir adım at.", "soru": "Şu an en çok kafa yorduğun şeyin ne kadarı gerçekten senin elinde?", "kaynak": "<a href=\"http://classics.mit.edu/Epictetus/epicench.html\" target=\"_blank\" rel=\"noopener\">Enchiridion, MIT Classics<\/a>", "ask": "Bugünün felsefe notu: Epiktetos, “Elindeki ve elinde olmayan”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F30", "title": "Kötülüğün sıradanlığı", "thinker": "Hannah Arendt", "kim": "Hannah Arendt, 1906–1975, Alman doğumlu siyaset düşünürü", "fikir": "Arendt, Eichmann'ın yargılanmasını anlattığı kitabın (<em>Eichmann in Jerusalem<\/em>, 1963) alt başlığında 'kötülüğün sıradanlığı' ifadesini kullandı. Stanford Felsefe Ansiklopedisi'ne göre bu, kötülük üzerine genel bir kuram değil, Eichmann'ın karakterini ve güdülerini anlatan bir ifadedir. Arendt onda düşünme konusunda tuhaf ve gerçek bir yetersizlik görür ve bunu 'düşüncesizlik' diye adlandırır, yani olaylara başkasının bakış açısından bakamamak. İfade büyük bir tartışma yarattı.", "alinti": "", "bugun": "'Bana söylendi, herkes yapıyor' diye yaptığın bir şeyi bul ve kendi nedenini bir cümleyle yaz.", "soru": "En son ne zaman bir şeyi düşünmeden, alışkanlıkla ya da emirle yaptın?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/arendt/\" target=\"_blank\" rel=\"noopener\">SEP: Hannah Arendt<\/a>", "ask": "Bugünün felsefe notu: Hannah Arendt, “Kötülüğün sıradanlığı”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F25", "title": "Sisifos&#x27;u mutlu hayal et", "thinker": "Camus", "kim": "Albert Camus, 1913–1960, Cezayir doğumlu Fransız yazar ve filozof", "fikir": "<em>Sisifos Söyleni<\/em>'nde Sisifos, kayayı sonsuza dek tepeye çıkarmaya mahkûm edilmiş efsane kahramandır. Stanford Felsefe Ansiklopedisi'ne göre Camus, onun aşağı inerken kaderinden üstün olduğunu söyler ve kitabı 'Sisifos'u mutlu hayal etmek gerekir' cümlesiyle bitirir. Eleştirmenler Camus'nün şüpheden bir yaşam ilkesine geçerken 'el çabukluğu' yaptığını söyler; yani bu bir kesinlik değil, bir tutum önerisidir.", "alinti": "", "bugun": "Tekrar eden bir işi (bulaşık, rapor, yürüyüş) tam dikkatle yap ve içinde küçük bir şey beğenmeye çalış.", "soru": "Hayatındaki hangi tekrar, yük olmaktan çıkıp sana ait bir şey olabilir?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/camus/\" target=\"_blank\" rel=\"noopener\">SEP: Camus<\/a>", "ask": "Bugünün felsefe notu: Camus, “Sisifos'u mutlu hayal et”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F19", "title": "Neden-sonuç bir alışkanlık mı?", "thinker": "Hume", "kim": "David Hume, 1711–1776, İskoç filozof ve deneyci (bilginin deneyimden geldiğini savunan)", "fikir": "Hume, bir olayın ötekine neden olduğunu hiç görmediğimizi, yalnızca birinin ardından ötekinin geldiğini defalarca gördüğümüzü söyler. Zihnimiz tekrar görünce sonrakini beklemeye alışır ve 'neden-sonuç' dediğimiz bağ büyük ölçüde bu alışkanlıktır. Hume bunun hayatta işe yaradığını kabul eder; ama temelinin akıl değil alışkanlık olduğunu söyler.", "alinti": "\"O halde alışkanlık, insan hayatının büyük rehberidir.\" (<em>An Enquiry Concerning Human Understanding<\/em>, V. bölüm, 1. kısım, E 5.6 / SBN 44–45; çeviri: Kutsi, Hume Texts Online'ın İngilizcesinden)", "bugun": "'Bu hep böyle olur' dediğin bir şeyi seç ve bunu gerçekten kaç kez gözlemlediğini say.", "soru": "Tahminlerinin ne kadarı kanıta, ne kadarı alışkanlığa dayanıyor?", "kaynak": "<a href=\"https://davidhume.org/texts/e/5\" target=\"_blank\" rel=\"noopener\">Enquiry, V, Hume Texts Online<\/a>", "ask": "Bugünün felsefe notu: Hume, “Neden-sonuç bir alışkanlık mı?”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F02", "title": "Sabah hazırlığı", "thinker": "Marcus Aurelius", "kim": "Marcus Aurelius, MS 121–180, Roma imparatoru, Stoacı", "fikir": "Marcus Aurelius sabaha, zor insanlarla karşılaşacağını kendine hatırlatarak başlar. Bu insanlar iyiyi kötüden ayırmayı bilmedikleri için öyle davranır ve ona gerçekten zarar veremez. Üstelik onlar da kendisi gibi akıl sahibidir; insanlar ayaklar, eller ve göz kapakları gibi iş birliği için yaratılmıştır. Bu yüzden öfke ve yüz çevirme doğaya aykırıdır, diye düşünür.", "alinti": "\"Sabaha kendine şunu söyleyerek başla: Başkasının işine burnunu sokanla, nankörle, kibirliyle, hilekârla, kıskançla karşılaşacağım…\" (<em>Düşünceler<\/em> [Meditations], 2. Kitap, ilk paragraf; sayfa paragrafları numaralamıyor; çeviri: Kutsi, George Long'un İngilizcesinden)", "bugun": "Bugün zor bir insanla karşılaşacaksan daha sabahtan 'biliyordum' de ve ona karşılık vermeden önce bir nefes bekle.", "soru": "Seni en çok yoran insan, neyi bilmediği için öyle davranıyor olabilir?", "kaynak": "<a href=\"http://classics.mit.edu/Antoninus/meditations.2.two.html\" target=\"_blank\" rel=\"noopener\">Meditations, 2. Kitap, MIT Classics<\/a>", "ask": "Bugünün felsefe notu: Marcus Aurelius, “Sabah hazırlığı”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F23", "title": "Kaderi sevmek", "thinker": "Nietzsche", "kim": "Friedrich Nietzsche, 1844–1900, Alman filozof", "fikir": "<em>Şen Bilim<\/em>'in (<em>The Gay Science<\/em>) dördüncü kitabı 'amor fati' ile açılır; Latincede 'kaderi sevmek' demektir (aforizma 276). Stanford Felsefe Ansiklopedisi'ne göre Nietzsche, işlerde zorunlu olanı güzel görmeyi öğrenmek ve çirkin olana suçlama ya da savaş açmamak ister. Bunu her şeyi onaylamak değil, olanı kabul edip içinden bir şey yapmak olarak okuyabiliriz.", "alinti": "", "bugun": "Değiştiremediğin bir durumu seç ve 'buna rağmen ne yapabilirim?' diye tek bir iş yaz.", "soru": "Hayatında 'keşke böyle olmasaydı' dediğin hangi şey, bir yerden sonra sana bir şey kazandırdı?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/nietzsche/\" target=\"_blank\" rel=\"noopener\">SEP: Nietzsche<\/a>", "ask": "Bugünün felsefe notu: Nietzsche, “Kaderi sevmek”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F22", "title": "Geriye bakarak anlaşılan hayat", "thinker": "Kierkegaard", "kim": "Søren Kierkegaard, 1813–1855, Danimarkalı filozof", "fikir": "Kierkegaard'a atfedilen ünlü bir günlük notu (genellikle 1843'e tarihlenir) şöyle özetlenir: hayat ancak geriye bakınca anlaşılır, ama ileriye doğru yaşanmak zorundadır. Karar anında bütün resim elimizde olmaz; bu bir yorumdur. Stanford Felsefe Ansiklopedisi'ne göre Kierkegaard'ın üç 'varoluş alanı' (estetik, etik, dinî) arasındaki geçişler de hazır bilgiyle değil, kişinin iç dönüşümüyle olur.", "alinti": "", "bugun": "Ertelediğin bir kararı al; eksik bilgiyle ilerlediğini kabul edip tek bir adım at.", "soru": "Geriye baktığında anlamlandırdığın hangi olay, yaşarken anlamsız görünüyordu?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/kierkegaard/\" target=\"_blank\" rel=\"noopener\">SEP: Kierkegaard<\/a>", "ask": "Bugünün felsefe notu: Kierkegaard, “Geriye bakarak anlaşılan hayat”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F15", "title": "Gerekli istekler, boş istekler", "thinker": "Epikuros", "kim": "Epikuros (Epicurus), MÖ 341–270, Epikurosçu okulun kurucusu", "fikir": "Epikuros isteklerin hepsinin aynı olmadığını söyler: bir kısmı doğaldır, bir kısmı temelsizdir. Doğal olanların bazıları ayrıca zorunludur; mutluluk, bedenin rahatı ya da yaşamın sürmesi için gerekir. Bunu bilen biri her tercihini bedenin sağlığına ve zihnin dinginliğine yöneltir, der. Yani bir isteğin hangi gruba girdiğine bakmak, ona yetişmekten önce gelir.", "alinti": "\"İsteklerin bir kısmı doğaldır, bir kısmı temelsizdir.\" (<em>Menoikeus'a Mektup<\/em> [Letter to Menoeceus], 'We must also reflect' ile başlayan paragraf; sayfa numaralamıyor; çeviri: Kutsi, R. D. Hicks'in İngilizcesinden)", "bugun": "Satın almak ya da peşinden koşmak istediğin bir şeyi üç gruptan birine koy: gerekli, doğal ama gereksiz, boş.", "soru": "Bu hafta peşinden koştuğun şeylerden hangisi 'boş' gruba giriyor?", "kaynak": "<a href=\"http://classics.mit.edu/Epicurus/menoec.html\" target=\"_blank\" rel=\"noopener\">Letter to Menoeceus, MIT Classics<\/a>", "ask": "Bugünün felsefe notu: Epikuros, “Gerekli istekler, boş istekler”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F14", "title": "Şüphe ve kesinlik", "thinker": "Gazali", "kim": "Gazali (al-Ghazālī), 1058–1111, İslam dünyasında kelamcı (din bilgini), filozof eleştirmeni ve sufi (manevi yolu seçen düşünür)", "fikir": "Gazali, <em>el-Munkız mine'd-Dalal<\/em> ('Dalaletten Kurtuluş') adlı otobiyografisinde kendi yolculuğunu anlatır. Felsefeyi inceler, filozofları eleştiren <em>Tehafüt<\/em>'ü yazar ve sonunda sufi yoluna girer. Stanford Felsefe Ansiklopedisi'ne göre bunda, tasavvuf yazılarını okumasının, kelam kanaatlerinin tek başına yetmediğini ona göstermesi etkili olmuştur. Kitap, duyulara ve akla güvenin sorgulandığı bir şüphe dönemi ve kesinliğe dönüşle de bilinir.", "alinti": "", "bugun": "'Kesin biliyorum' dediğin bir şeyi seç ve nereden bildiğini tek cümleyle yaz.", "soru": "En çok güvendiğin kaynağa neden güveniyorsun?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/al-ghazali/\" target=\"_blank\" rel=\"noopener\">SEP: al-Ghazali<\/a>", "ask": "Bugünün felsefe notu: Gazali, “Şüphe ve kesinlik”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F10", "title": "Dört filiz", "thinker": "Mencius", "kim": "Mencius (Mengzi), MÖ 372–289 civarı, Konfüçyüsçü düşünür", "fikir": "Mencius'a göre insanda erdemin dört 'filizi' doğuştan vardır: merhamet, kötülüğü küçümseme, doğruyu yanlıştan ayırma ve saygı. Bunlar henüz tohum gibidir ve geliştirilmeleri gerekir. Kanıt olarak, bir çocuğun kuyuya düşmek üzere olduğunu gören herkesin ürperti ve merhamet duyacağını gösterir; bunu çıkar ya da ün için hissetmez. Böylece insanın yalnızca kendi çıkarını düşündüğü görüşüne karşı çıkar (Mencius 2A6).", "alinti": "", "bugun": "İçinden gelen küçük bir iyilik dürtüsünü, örneğin bir nezaketi, bastırmadan yap.", "soru": "Hangi iyi dürtünü büyütmek için hiç emek vermedin?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/mencius/\" target=\"_blank\" rel=\"noopener\">SEP: Mencius<\/a>", "ask": "Bugünün felsefe notu: Mencius, “Dört filiz”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F20", "title": "Odada sessizce oturmak", "thinker": "Pascal", "kim": "Blaise Pascal, 1623–1662, Fransız matematikçi ve düşünür", "fikir": "Pascal'a göre insanlar kendileriyle baş başa kalmamak için sürekli oyalanır. Fransızca <em>divertissement<\/em> tam olarak bu demektir: dikkati dağıtan şey. Internet Encyclopedia of Philosophy'nin özetine göre bir an durup kendimize dürüstçe baksak çaresizliğimizi görürüz. Ünlü bir parçasında (<em>Pensées<\/em>, Brunschvicg 139 / Lafuma 136) insanın mutsuzluğunun, bir odada sessizce oturmayı bilmemesinden geldiğini söyler.", "alinti": "", "bugun": "On dakika telefonsuz bir yerde sessizce otur ve elinin hangi şeye uzandığını not et.", "soru": "Sessizlikte en çok neyle yüzleşmemek için telefona uzanıyorsun?", "kaynak": "<a href=\"https://iep.utm.edu/pascal/\" target=\"_blank\" rel=\"noopener\">IEP: Pascal<\/a>", "ask": "Bugünün felsefe notu: Pascal, “Odada sessizce oturmak”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F16", "title": "Kendini incelemek", "thinker": "Montaigne", "kim": "Michel de Montaigne, 1533–1592, Fransız deneme yazarı ve şüpheci (kesin bilginin zor olduğunu düşünen)", "fikir": "Montaigne'in <em>Denemeler<\/em>'i (<em>Essais<\/em>) kendine bakmanın kitabıdır. Stanford Felsefe Ansiklopedisi'ne göre yazmaktaki amacı, kendini eğitmek ve geliştirmekti. İnsanı genel olarak tanımlamaya girişmez; başkalarının insanı biçimlendirmeye çalıştığını, onun ise insanı yalnızca anlattığını söyler. Şüphe şiarı 'Que sais-je?' yani 'Ben ne bilirim?'dir.", "alinti": "", "bugun": "Gün sonunda üç cümleyle yaz: bugün kendimde ne fark ettim?", "soru": "Kendin hakkında en son ne öğrendin ve bunu nereden fark ettin?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/montaigne/\" target=\"_blank\" rel=\"noopener\">SEP: Montaigne<\/a>", "ask": "Bugünün felsefe notu: Montaigne, “Kendini incelemek”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F03", "title": "Hayat uzun, eğer kullanırsan", "thinker": "Seneca", "kim": "Seneca (Lucius Annaeus Seneca), MÖ 4 – MS 65 civarı, Roma'lı Stoacı yazar ve devlet adamı", "fikir": "Seneca, <em>De Brevitate Vitae<\/em>'de ('Hayatın Kısalığı Üzerine') hayatın kısa olmadığını, bizim onu harcadığımızı söyler. Zamanı başkalarının istekleri, boş işler ve erteleme yer. Stanford Felsefe Ansiklopedisi'ne göre zaman Seneca'nın yazılarında sürekli dönen bir temadır ve iyi yaşamak, her günü sanki hayatın bütününü taşıyormuş gibi görmek demektir.", "alinti": "", "bugun": "Takvimine bak ve en çok zamanını yiyen tek işi bul: onu gerçekten istiyor muydun?", "soru": "Bu hafta hangi saatlerini başkası seçti, sen seçmedin?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/seneca/\" target=\"_blank\" rel=\"noopener\">SEP: Seneca<\/a>", "ask": "Bugünün felsefe notu: Seneca, “Hayat uzun, eğer kullanırsan”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F29", "title": "Paradigmalar", "thinker": "Kuhn", "kim": "Thomas Kuhn, 1922–1996, Amerikalı bilim tarihçisi ve felsefecisi", "fikir": "Kuhn, <em>Bilimsel Devrimlerin Yapısı<\/em>'nda (1962) bilimin düz bir birikim olmadığını savunur. Bilim insanları çoğu zaman bir paradigma içinde, yani paylaşılan bir çerçeve ve örnek çözümler içinde bulmaca çözer; buna normal bilim der. Çerçeveye sığmayan sorunlar 'anomali' olarak birikir, güven sarsılırsa kriz gelir ve rakip bir paradigma öncekinin yerini alırsa devrim olur. Farklı paradigmaları karşılaştıracak ortak bir ölçü olmadığını da söyler.", "alinti": "", "bugun": "Çalıştığın alanın çözemediği tek bir anomaliyi bul: hangi çerçeve varsayımı onu açıklayamıyor?", "soru": "Alanında herkesin kabul ettiği hangi varsayım, gelecekte sorgulanabilir?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/thomas-kuhn/\" target=\"_blank\" rel=\"noopener\">SEP: Thomas Kuhn<\/a>", "ask": "Bugünün felsefe notu: Kuhn, “Paradigmalar”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F04", "title": "İncelenmemiş hayat", "thinker": "Sokrates", "kim": "Sokrates (Socrates), MÖ 470–399, Atinalı filozof; sözleri öğrencisi Platon'un yazdığı <em>Savunma<\/em>'dan bilinir", "fikir": "Sokrates Atina mahkemesinde suçlu bulunur. Cezası tartışılırken, susup sessizce yaşamayı kabul etmesi önerilir. Felsefe yapmayı, yani insanlarla sorgulayarak konuşmayı bırakmanın tanrının emrine aykırı olacağını söyler. Her gün erdem, yani iyi bir insan olmanın yolu üzerine konuşmayı insanın en büyük iyiliği sayar.", "alinti": "\"…incelenmemiş hayat yaşamaya değmez.\" (<em>Savunma<\/em> [Apology] 38a; çeviri: Kutsi, Benjamin Jowett'in İngilizcesinden)", "bugun": "Bir alışkanlığını seç ve 'bunu neden yapıyorum?' diye kendine sor, cevabı bir cümleyle yaz.", "soru": "Hayatında hangi seçimi hiç sorgulamadan sürdürüyorsun?", "kaynak": "<a href=\"http://classics.mit.edu/Plato/apology.html\" target=\"_blank\" rel=\"noopener\">Apology, MIT Classics<\/a>", "ask": "Bugünün felsefe notu: Sokrates, “İncelenmemiş hayat”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F08", "title": "Kelebek rüyası", "thinker": "Zhuangzi", "kim": "Zhuangzi (Chuang Tzu), MÖ 4. yüzyıl civarı, Çinli Taoist düşünür", "fikir": "Zhuangzi bir kelebek olduğunu rüyasında görür ve uyanınca emin olamaz: ben kelebek olduğunu gören Zhuang Zhou muyum, yoksa Zhuang Zhou olduğunu gören bir kelebek mi? Hikâye kitabın ikinci bölümünde yer alır; bu bölüm, Stanford Felsefe Ansiklopedisi'ne göre görecelik ve şüphe üzerine yoğunlaşır. Birçok yorumcu bunu 'uyanık' ile 'rüya' arasındaki çizginin sandığımız kadar sabit olmadığının işareti olarak okur.", "alinti": "", "bugun": "Çok emin olduğun bir yargıyı seç ve tersinin de savunulabilecek bir yanı var mı diye bak.", "soru": "Hangi 'kesin' bildiğin şey, sadece alıştığın bakış açısı olabilir?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/zhuangzi/\" target=\"_blank\" rel=\"noopener\">SEP: Zhuangzi<\/a>", "ask": "Bugünün felsefe notu: Zhuangzi, “Kelebek rüyası”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F11", "title": "Zihin öncedir", "thinker": "Buddha (Dhammapada)", "kim": "<em>Dhammapada<\/em>, erken dönem Budist öğretilerin ayetler halinde derlemesi; geleneksel olarak Buddha'ya (MÖ 5. yüzyıl civarı) bağlanan öğretiler", "fikir": "<em>Dhammapada<\/em>'nın ilk ayeti zihni her şeyin öncüsü sayar: sözlerimiz ve davranışlarımız zihinden doğar. Saf bir zihinle konuşan ya da davranan kişiyi mutluluk, hiç ayrılmayan gölgesi gibi izler (2. ayet). Bozuk bir zihinle konuşana ya da davrananı ise acı izler.", "alinti": "\"Zihin bütün zihinsel durumlardan önce gelir. Zihin onların başıdır; hepsi zihnin eseridir.\" (<em>Dhammapada<\/em> 1, Yamakavagga bölümü; çeviri: Kutsi, Acharya Buddharakkhita'nın İngilizcesinden)", "bugun": "Ağzından çıkacak ilk sert cümleden önce, onu hangi ruh halinin söylettiğine bak.", "soru": "Dün yaptığın bir şeyin altında hangi ruh hali vardı?", "kaynak": "<a href=\"https://www.accesstoinsight.org/tipitaka/kn/dhp/dhp.01.budd.html\" target=\"_blank\" rel=\"noopener\">Dhammapada 1, Access to Insight<\/a>", "ask": "Bugünün felsefe notu: Buddha (Dhammapada), “Zihin öncedir”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F13", "title": "Yüzen adam", "thinker": "İbn Sina", "kim": "İbn Sina (Avicenna), 980–1037, İslam dünyasında hekim ve filozof", "fikir": "'Yüzen adam' bir düşünce deneyidir, yani kafada kurulan bir senaryodur. İbn Sina, kusursuz yaratılmış ama havada asılı kalmış, hiçbir şey algılayamayan bir insan hayal eder. Bu adam bedenini algılamasa da kendi varlığından şüphe edemez, çünkü düşünen biri vardır. İbn Sina bundan ruhun bedenden bağımsız olduğu sonucunu çıkarır; yorumcular bunu Descartes'ın 'düşünüyorum, öyleyse varım' fikrinden yaklaşık 600 yıl önce gelen bir benzeri sayar.", "alinti": "", "bugun": "İki dakika gözlerini kapat ve bedenin dışında 'ben' dediğin şeyin ne olduğunu tarif etmeye çalış.", "soru": "Duyuların ve anıların olmasa, 'ben' olarak geriye ne kalırdı?", "kaynak": "<a href=\"https://iep.utm.edu/avicenna/\" target=\"_blank\" rel=\"noopener\">IEP: Avicenna<\/a>", "ask": "Bugünün felsefe notu: İbn Sina, “Yüzen adam”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F26", "title": "Varoluş özden önce gelir", "thinker": "Sartre", "kim": "Jean-Paul Sartre, 1905–1980, Fransız filozof ve yazar", "fikir": "Sartre'a göre insan önce var olur, ne olacağını sonra kendi seçimleriyle belirler. 'Öz' (essence), bir şeyin ne olduğunu belirleyen tanımdır; bir kâğıt kesicinin amacı, yapılmadan önce zaten bellidir. İnsan için böyle önceden verilmiş bir tanım yoktur. Bu özgürlük aynı zamanda ağır bir sorumluluktur.", "alinti": "\"İnsan önce var olur, kendisiyle karşılaşır, dünyada belirir ve kendini ancak sonra tanımlar.\" (<em>Existentialism Is a Humanism<\/em> [Varoluşçuluk Bir Hümanizmdir], 1946 konferansı; sayfa numaralamıyor; çeviri: Kutsi, Philip Mairet'in İngilizcesinden)", "bugun": "'Ben böyle biriyim' dediğin bir kalıbı fark et ve tersini bir kez denemeyi düşün.", "soru": "'Ben zaten böyleyim' dediğin hangi şey aslında bir seçimdi?", "kaynak": "<a href=\"https://www.marxists.org/reference/archive/sartre/works/exist/sartre.htm\" target=\"_blank\" rel=\"noopener\">Existentialism Is a Humanism, Marxists Internet Archive<\/a>", "ask": "Bugünün felsefe notu: Sartre, “Varoluş özden önce gelir”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F18", "title": "Duyguyu anlamak", "thinker": "Spinoza", "kim": "Baruch Spinoza, 1632–1677, Hollandalı filozof", "fikir": "Spinoza, <em>Etika<\/em>'nın (<em>Ethics<\/em>) beşinci bölümünde, bir tutkunun ona dair açık ve net bir fikir oluşturduğumuzda tutku olmaktan çıktığını söyler (5. bölüm, 3. önerme). Tutku burada, bizi dışarıdan iten ve nedenini bilmediğimiz duygu demektir. Stanford Felsefe Ansiklopedisi'ne göre Spinoza, kendi duygularımızın gerçek nedeni olduğumuzda daha özgür olduğumuzu ve kendini bilmenin etik önemini vurgular. Bunu bastırmak değil, anlamak olarak okuyabiliriz.", "alinti": "", "bugun": "Güçlü bir duygu geldiğinde ona bir isim ver ve onu neyin tetiklediğini bir cümleyle yaz.", "soru": "Seni sık sık harekete geçiren ama nedenini bilmediğin duygu hangisi?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/spinoza-psychological/\" target=\"_blank\" rel=\"noopener\">SEP: Spinoza's Psychological Theory<\/a>", "ask": "Bugünün felsefe notu: Spinoza, “Duyguyu anlamak”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F06", "title": "Haz, acının yokluğudur", "thinker": "Epikuros", "kim": "Epikuros (Epicurus), MÖ 341–270, Epikurosçu okulun kurucusu", "fikir": "Epikuros 'amaç hazdır' derken ziyafeti ya da şehveti kastetmediğini, bunun yanlış anlaşıldığını söyler. Haz, bedende acının ve ruhta sıkıntının olmamasıdır. Buna her seçimin ve kaçınmanın nedenini sakin akılla tartarak varılır. En değerli erdem sağduyudur, yani neyin işe yarayacağını soğukkanlı tartma yeteneğidir; hoş bir hayat ondan, onurdan ve adaletten ayrılmaz.", "alinti": "\"Hazdan kastımız, bedende acının ve ruhta sıkıntının olmamasıdır.\" (<em>Menoikeus'a Mektup<\/em> [Letter to Menoeceus], 'When we say, then, that pleasure is the end and aim' ile başlayan paragraf; sayfa numaralamıyor; çeviri: Kutsi, R. D. Hicks'in İngilizcesinden)", "bugun": "İstediğin bir şeyi almadan önce sor: bu bana gerçekten bir sıkıntıyı mı gideriyor, yoksa sadece bir arzuyu mu besliyor?", "soru": "Seni asıl rahatsız eden şey ne ve onu gidermek için yaptığın şey işe yarıyor mu?", "kaynak": "<a href=\"http://classics.mit.edu/Epicurus/menoec.html\" target=\"_blank\" rel=\"noopener\">Letter to Menoeceus, MIT Classics<\/a>", "ask": "Bugünün felsefe notu: Epikuros, “Haz, acının yokluğudur”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F12", "title": "Mutluluk ve erdemli şehir", "thinker": "Farabi", "kim": "Farabi (al-Fārābī), 870–950 civarı, İslam dünyasının Aristotelesçi filozofu", "fikir": "Farabi, <em>Erdemli Şehir Halkının Görüşleri<\/em> adlı kitabında ('Mükemmel Devlet' adıyla İngilizceye de çevrildi) ideal bir toplumun nasıl düzenleneceğini anlatır. Kitap evrenin düzenini anlatan bir bölümle başlar ve şehrin kademeli yapısı bu düzeni yansıtır. Stanford Felsefe Ansiklopedisi'ne göre bazı eserlerinde nihai mutluluğu, insan aklının 'Faal Akıl'la yani bilgiyi insan zihnine ileten kozmik akılla birleşmesi olarak tanımlar.", "alinti": "", "bugun": "İçinde bulunduğun grubun (aile, ekip, mahalle) iyi işleyen tek bir kuralını fark et ve neden işe yaradığını düşün.", "soru": "Mutluluğun için hangi topluluğun iyi işlemesi gerekiyor?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/al-farabi/\" target=\"_blank\" rel=\"noopener\">SEP: al-Farabi<\/a>", "ask": "Bugünün felsefe notu: Farabi, “Mutluluk ve erdemli şehir”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F05", "title": "Erdem bir alışkanlıktır", "thinker": "Aristoteles", "kim": "Aristoteles (Aristotle), MÖ 384–322, Yunan filozof", "fikir": "Aristoteles'e göre ahlaki erdemler, yani cesaret, ölçülülük ve adalet gibi iyi karakter özellikleri, doğuştan gelmez. Doğada bulunan şey, onları kazanabilme yeteneğidir; kazanmak ise alışkanlıkla olur. Ahlak sözcüğünün Yunancası bile 'alışkanlık' sözcüğünden türer.", "alinti": "\"Aynı şekilde, adil işler yaparak adil oluruz\" (<em>Nikomakhos'a Etik<\/em> [Nicomachean Ethics] II.1; çeviri: Kutsi, W. D. Ross'un İngilizcesinden)", "bugun": "Olmak istediğin karakterden tek bir küçük hareket yap, örneğin sabırsız olduğun yerde bir kez beklemek.", "soru": "Hangi erdemi istiyorsun ve onu çalıştıracak küçük tekrar ne olabilir?", "kaynak": "<a href=\"http://classics.mit.edu/Aristotle/nicomachaen.2.ii.html\" target=\"_blank\" rel=\"noopener\">Nicomachean Ethics, II, MIT Classics<\/a>", "ask": "Bugünün felsefe notu: Aristoteles, “Erdem bir alışkanlıktır”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F09", "title": "Öğrenmek ve düşünmek", "thinker": "Konfüçyüs", "kim": "Konfüçyüs (Kongzi), MÖ 551–479, Çinli öğretmen ve düşünür", "fikir": "<em>Analects<\/em> (Lunyu), öğrencilerinin Konfüçyüs'ün sözlerini derlediği kitaptır. Burada öğrenmek ve düşünmek birlikte yürümelidir. Düşünmeden öğrenirsen bilgi yalnızca yığılır ve emek boşa gider. Öğrenmeden düşünürsen kendi tahminlerinle baş başa kalırsın ve bu tehlikelidir.", "alinti": "\"Düşünmeden öğrenmek emeği boşa harcamaktır; öğrenmeden düşünmek tehlikelidir.\" (<em>Analects<\/em>, MIT sayfasında 'Part 2' başlığı altında on beşinci söz, yani 2.15; sayfa çevirmen belirtmiyor; çeviri: Kutsi, sayfanın İngilizcesinden)", "bugun": "Bugün okuduğun ya da duyduğun bir şeyi tek cümleyle kendi sözlerinle yeniden yaz.", "soru": "Şu an öğrendiğin konuda hangisini ihmal ediyorsun: öğrenmeyi mi, düşünmeyi mi?", "kaynak": "<a href=\"http://classics.mit.edu/Confucius/analects.1.1.html\" target=\"_blank\" rel=\"noopener\">Analects, MIT Classics<\/a>", "ask": "Bugünün felsefe notu: Konfüçyüs, “Öğrenmek ve düşünmek”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}, {"id": "F28", "title": "Yanlışlanabilirlik", "thinker": "Popper", "kim": "Karl Popper, 1902–1994, Avusturya doğumlu bilim felsefecisi", "fikir": "Popper, bilimi bilim olmayandan ayırmak için 'yanlışlanabilirlik' ölçütünü önerir: bir kuram, mümkün bir gözlemle çelişebiliyorsa, yani bazı sonuçları yasaklıyorsa bilimseldir. Einstein'ın 1919'da ışığın sapmasıyla sınanan riskli tahminini, her davranışı açıklayabilen Freud ve Adler kuramlarıyla karşılaştırır. Her şeyi açıklamak ona göre güç değil zayıflıktır. Eleştirmenler (Lakatos, Putnam), kuramların yardımcı varsayımlarla korunabildiğini ve tek bir çürütmenin işi bitirmediğini söyler.", "alinti": "", "bugun": "İnandığın bir iddia için şunu sor: hangi gözlem beni yanıltırdı? Cevap yoksa iddia test edilemiyor olabilir.", "soru": "Kendi çalışmanda hangi tahmin, yanlış çıkabileceği için değerli?", "kaynak": "<a href=\"https://plato.stanford.edu/entries/popper/\" target=\"_blank\" rel=\"noopener\">SEP: Karl Popper<\/a>", "ask": "Bugünün felsefe notu: Popper, “Yanlışlanabilirlik”. Bu fikri biraz aç: birincil kaynaktan kısa bir örnek, bugün nasıl uygularım ve buna itiraz eden bir düşünür. Türkçe, kısa, kaynak göster."}], "bilim": [{"id": "b-donenler-ve-kasifler", "kind": "fact", "title": "Dönenler ve kaşifler", "front": "Telefon ve GPS verisinde insanların gezme biçimi hangi iki ayrı sınıfa ayrılıyor?", "ask": "Bilim defterimden: “Dönenler ve kaşifler”. Telefon ve GPS verisinde iki ayrı sınıf çıkıyor: hep aynı birkaç yere dönenler ve yeni yerlere gidenler Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "psikoloji-ve-davranis", "secn": "Psikoloji ve davranış", "back": "Telefon ve GPS verisinde iki ayrı sınıf çıkıyor: hep aynı birkaç yere dönenler ve yeni yerlere gidenler", "label": "🔵", "src": "Pappalardo ve ark. 2015, <em>Nature Communications<\/em> 6:8166 · <a href=\"https://research.ceu.edu/en/publications/returners-and-explorers-dichotomy-in-human-mobility/\" target=\"_blank\" rel=\"noopener\">CEU<\/a>", "added": "2026-11-04"}, {"id": "b-dunyanin-frekansi-schumann-rezonansi", "kind": "fact", "title": "Dünya'nın frekansı (Schumann rezonansı)", "front": "Schumann rezonansı nedir, temel frekansı kaç Hz ve kulakla duyulabilir mi?", "ask": "Bilim defterimden: “Dünya'nın frekansı (Schumann rezonansı)”. Yıldırımlar, yer ile iyonosfer arasındaki boşlukta duran bir elektromanyetik dalga yaratıyor. Temel frekansı ~7,83 Hz; dalga boyu Dünya'nın çevresi kadar. Schumann 1952'de hesapladı, Balser ve Wagner 1960'larda ölçtü. Bu bir ses değil, radyo dalgası: duyulmaz Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "fizik-ve-astronomi", "secn": "Fizik ve astronomi", "back": "Yıldırımlar, yer ile iyonosfer arasındaki boşlukta duran bir elektromanyetik dalga yaratıyor. Temel frekansı ~7,83 Hz; dalga boyu Dünya'nın çevresi kadar. Schumann 1952'de hesapladı, Balser ve Wagner 1960'larda ölçtü. <strong>Bu bir ses değil, radyo dalgası: duyulmaz<\/strong>", "label": "🟢", "src": "<a href=\"https://en.wikipedia.org/wiki/Schumann_resonances\" target=\"_blank\" rel=\"noopener\">Wikipedia<\/a>", "added": "2026-11-04"}, {"id": "m-dunyayi-yonetenler-ezoterik-bilgiyle-sistem-kuruyor", "kind": "myth", "title": "", "front": "\"Dünyayı yönetenler ezoterik bilgiyle sistem kuruyor\"", "ask": "Şu iddiayı kontrol et: \"Dünyayı yönetenler ezoterik bilgiyle sistem kuruyor\". Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Reel (@marcotrunzo, 75 bin beğeni): şehirler kutsal geometriyle, logolar okült sembollerle kuruldu, tarihî olaylar numeroloji ve astrolojiyle zamanlandı. Kaynak yok; reel'deki örneklerin hepsi aşağıda çürüyor. Logolarda gösterilen \"Mason\" işaretleri Gmail ve Chrome gibi sıradan logolara sonradan konmuş etiketler; beyin rastgele şekillerde anlam görür (apofeni)", "label": "🔴", "src": "kayıt", "added": "2026-11-04"}, {"id": "b-eksik-temel-missing-fundamental", "kind": "fact", "title": "Eksik temel (missing fundamental)", "front": "Bir sesin temel frekansı tamamen kesilse de onu hangi perdede duyarız ve neden?", "ask": "Bilim defterimden: “Eksik temel (missing fundamental)”. Bir sesin temel frekansı tamamen çıkarılsa da harmonikleri (ör. 200, 300, 400 Hz) duruyorsa beyin perdeyi yine temel frekansta (100 Hz) duyar; değişen sadece tını. Eski telefon hatları ~300 Hz altını iletmediği hâlde bir erkeğin sesini yine kalın duyman bundan. Küçük hoparlörde b Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "terimler", "secn": "Terimler", "back": "Bir sesin temel frekansı tamamen çıkarılsa da harmonikleri (ör. 200, 300, 400 Hz) duruyorsa beyin perdeyi yine temel frekansta (100 Hz) duyar; değişen sadece tını. Eski telefon hatları ~300 Hz altını iletmediği hâlde bir erkeğin sesini yine kalın duyman bundan. Küçük hoparlörde bas varmış gibi gösteren \"sanal bas\" efektleri de bunu kullanıyor", "label": "🟢", "src": "Seebeck (1840'lar) · Schouten (1940'lar) · <a href=\"https://www.sfu.ca/sonic-studio-webdav/handbook/Residue.html\" target=\"_blank\" rel=\"noopener\">SFU akustik el kitabı: Residue<\/a> · <a href=\"https://en.wikipedia.org/wiki/Missing_fundamental\" target=\"_blank\" rel=\"noopener\">Wikipedia<\/a>", "added": "2026-11-23"}, {"id": "b-25-tanidik-yer", "kind": "fact", "title": "~25 tanıdık yer", "front": "Bir insanın düzenli gittiği yer sayısı yaklaşık kaçta sabit kalıyor ve yeni bir yer eklenince ne oluyor?", "ask": "Bilim defterimden: “~25 tanıdık yer”. İnsanın düzenli gittiği yer sayısı ~25'te sabit kalıyor; yeni bir yer eskisinin yerini alıyor. Sayı, kişinin sosyal çevresinin büyüklüğüyle ilişkili (~40 bin kişi) Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "psikoloji-ve-davranis", "secn": "Psikoloji ve davranış", "back": "İnsanın düzenli gittiği yer sayısı ~25'te sabit kalıyor; yeni bir yer eskisinin yerini alıyor. Sayı, kişinin sosyal çevresinin büyüklüğüyle ilişkili (~40 bin kişi)", "label": "🔵", "src": "Alessandretti ve ark. 2018, <em>Nature Human Behaviour<\/em> · <a href=\"https://arxiv.org/abs/1609.03526v3\" target=\"_blank\" rel=\"noopener\">arXiv<\/a>", "added": "2026-11-04"}, {"id": "m-dunyanin-frekansi-yukseliyor-beynimiz-7-83-hze-ayarli-sifa-v", "kind": "myth", "title": "", "front": "\"Dünya'nın frekansı yükseliyor, beynimiz 7,83 Hz'e ayarlı, şifa veriyor\"", "ask": "Şu iddiayı kontrol et: \"Dünya'nın frekansı yükseliyor, beynimiz 7,83 Hz'e ayarlı, şifa veriyor\". Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "fizik-ve-astronomi", "secn": "Fizik ve astronomi", "back": "Bilimsel kanıtı yok. 7,83 Hz beyin dalgalarının teta ile alfa sınırına denk geliyor, ama bu sayısal bir rastlantı. Rezonans iyonosferle birlikte biraz oynuyor; yükseldiğini gösteren bir ölçüm yok", "label": "🔴", "src": "", "added": "2026-11-04"}, {"id": "m-parthenon-altin-oranla-yapildi", "kind": "myth", "title": "", "front": "\"Parthenon altın oranla yapıldı\"", "ask": "Şu iddiayı kontrol et: \"Parthenon altın oranla yapıldı\". Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Ölçümler tutmuyor. Parthenon'un ölçüleri altın orana ancak hangi noktaların ölçüleceği seçilerek uyduruluyor", "label": "🔴", "src": "Markowsky 1992, <em>The College Mathematics Journal<\/em> 23(1):2–19 (<a href=\"https://www.jstor.org/stable/2686193\" target=\"_blank\" rel=\"noopener\">JSTOR<\/a>)", "added": "2026-11-04"}, {"id": "b-apofeni-ve-pareidolia", "kind": "fact", "title": "Apofeni ve pareidolia", "front": "Apofeni ile pareidolia arasındaki fark ne ve parazit görüntüsünde yüz &quot;görülen&quot; anlarda beyinde ne oldu?", "ask": "Bilim defterimden: “Apofeni ve pareidolia”. Apofeni: rastgele şeylerde anlamlı bağlantı görme eğilimi; terimi psikiyatr Klaus Conrad 1958'de koydu. Pareidolia onun görsel hâli: prizde, bulutta, ekmekte yüz görmek. Bir deneyde insanlara saf parazit görüntüleri gösterilip yarısında yüz olduğu söylendi; katılımcılar denemeler Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "terimler", "secn": "Terimler", "back": "Apofeni: rastgele şeylerde anlamlı bağlantı görme eğilimi; terimi psikiyatr Klaus Conrad 1958'de koydu. Pareidolia onun görsel hâli: prizde, bulutta, ekmekte yüz görmek. Bir deneyde insanlara saf parazit görüntüleri gösterilip yarısında yüz olduğu söylendi; katılımcılar denemelerin %34'ünde yüz \"gördü\" ve o anlarda beynin yüz bölgesi (sağ fusiform yüz alanı) gerçekten çalıştı. Logolarda \"gizli sembol\" görmek ve eşzamanlılık hissi aynı eğilimin örnekleri", "label": "🟢", "src": "Conrad 1958 · Liu ve ark. 2014, <em>Cortex<\/em> 53:60–77 · <a href=\"https://pubmed.ncbi.nlm.nih.gov/24583223/\" target=\"_blank\" rel=\"noopener\">PubMed<\/a>", "added": "2026-11-23"}, {"id": "b-genis-zevk-uzun-kalis", "kind": "fact", "title": "Geniş zevk, uzun kalış", "front": "Spotify&#x27;da geniş zevkli dinleyiciler uygulamada dar zevklilerden nasıl farklı davranıyor?", "ask": "Bilim defterimden: “Geniş zevk, uzun kalış”. Spotify'da geniş zevkli dinleyiciler uygulamayı 25 puana kadar daha az bırakıyor ve daha çok ücretli üyeliğe geçiyor. Algoritmik öneriler ise dinlemeyi daraltıyor Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "psikoloji-ve-davranis", "secn": "Psikoloji ve davranış", "back": "Spotify'da geniş zevkli dinleyiciler uygulamayı 25 puana kadar daha az bırakıyor ve daha çok ücretli üyeliğe geçiyor. Algoritmik öneriler ise dinlemeyi daraltıyor", "label": "🔵", "src": "Anderson ve ark. 2020, WWW · <a href=\"https://www.cs.utoronto.ca/~ashton/pubs/alg-effects-spotify-www2020.pdf\" target=\"_blank\" rel=\"noopener\">PDF<\/a>", "added": "2026-11-04"}, {"id": "b-dunyanin-ugultusu-sismik-hum", "kind": "fact", "title": "Dünya'nın uğultusu (sismik \"hum\")", "front": "Deprem yokken bile Dünya&#x27;nın sürekli titreşmesine ne deniyor ve kaynağı büyük ihtimalle ne?", "ask": "Bilim defterimden: “Dünya'nın uğultusu (sismik \"hum\")”. Deprem olmasa da Dünya sürekli titriyor. Periyodu dakikalarla ölçülen, duyulamayacak kadar yavaş salınımlar. 1998'de keşfedildi, bugün 200'den fazla istasyonda ölçülüyor. Kaynağı büyük ihtimalle okyanus dalgalarının deniz tabanını dövmesi; bu kısım hâlâ tartışmalı Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "fizik-ve-astronomi", "secn": "Fizik ve astronomi", "back": "Deprem olmasa da Dünya sürekli titriyor. Periyodu dakikalarla ölçülen, duyulamayacak kadar yavaş salınımlar. 1998'de keşfedildi, bugün 200'den fazla istasyonda ölçülüyor. Kaynağı büyük ihtimalle okyanus dalgalarının deniz tabanını dövmesi; bu kısım hâlâ tartışmalı", "label": "🟢 kaynağı tartışmalı", "src": "Suda, Nawa ve Fukao 1998, <em>Science<\/em> 279:2089 · <a href=\"https://data-ww3.ifremer.fr/BIB/Suda_etal_SCIENCE1998.pdf\" target=\"_blank\" rel=\"noopener\">PDF<\/a>", "added": "2026-11-04"}, {"id": "m-4-temmuz-1776-numerolojiyle-secildi", "kind": "myth", "title": "", "front": "\"4 Temmuz 1776 numerolojiyle seçildi\"", "ask": "Şu iddiayı kontrol et: \"4 Temmuz 1776 numerolojiyle seçildi\". Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Bağımsızlık oyu 2 Temmuz'da verildi. 4 Temmuz, Kongre'nin bildirinin metnini düzeltip kabul ettiği gün. John Adams, eşine kutlanacak günün 2 Temmuz olacağını yazmıştı", "label": "🔴", "src": "<a href=\"https://en.wikipedia.org/wiki/Lee_Resolution\" target=\"_blank\" rel=\"noopener\">Wikipedia: Lee Resolution<\/a>", "added": "2026-11-04"}, {"id": "b-taban-orani-yanilgisi", "kind": "fact", "title": "Taban oranı yanılgısı", "front": "Hastalık 1000&#x27;de 1, test %5 yanlış pozitif: testi pozitif çıkan birinin gerçekten hasta olma ihtimali kabaca kaç?", "ask": "Bilim defterimden: “Taban oranı yanılgısı”. Bir hastalık 1000 kişide 1 kişide var, test %5 yanlış pozitif veriyor. Testi pozitif çıkan biri gerçekten hasta mı? Harvard'da 60 doktor ve öğrenciye soruldu; en sık cevap %95'ti (27 kişi). Doğrusu ~%2: 1000 kişide 1 gerçek hasta ve ~50 yanlış alarm var, yani pozitiflerin ancak 5 Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "terimler", "secn": "Terimler", "back": "Bir hastalık 1000 kişide 1 kişide var, test %5 yanlış pozitif veriyor. Testi pozitif çıkan biri gerçekten hasta mı? Harvard'da 60 doktor ve öğrenciye soruldu; en sık cevap %95'ti (27 kişi). Doğrusu ~%2: 1000 kişide 1 gerçek hasta ve ~50 yanlış alarm var, yani pozitiflerin ancak 51'de 1'i hasta. Hata, hastalığın nadirliğini (taban oranını) görmezden gelmek. Yüzde yerine \"1000 kişiden kaçı\" diye sorunca insanlar çok daha iyi cevap veriyor (Gigerenzer ve Hoffrage 1995)", "label": "🟢 2014&#x27;te tekrarlandı", "src": "Casscells, Schoenberger ve Graboys 1978, <em>NEJM<\/em> 299:999–1001 · Manrai ve ark. 2014 · <a href=\"https://www.youtube.com/shorts/2QSkkhbl3v4\" target=\"_blank\" rel=\"noopener\">Veritasium kısa video, 2026-11-11<\/a>", "added": "2026-11-23"}, {"id": "b-yenilik-ve-mutluluk", "kind": "fact", "title": "Yenilik ve mutluluk", "front": "122 kişi aylarca GPS&#x27;le izlendi: yeni yerlere gidilen günler ruh hâlini nasıl etkiledi?", "ask": "Bilim defterimden: “Yenilik ve mutluluk”. 122 kişi aylarca GPS'le izlendi: yeni yerlere gidilen günler daha mutlu geçti. Etki, beyinde hipokampus ile striatum arasındaki bağlantının güçlü olduğu kişilerde daha belirgindi Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "psikoloji-ve-davranis", "secn": "Psikoloji ve davranış", "back": "122 kişi aylarca GPS'le izlendi: yeni yerlere gidilen günler daha mutlu geçti. Etki, beyinde hipokampus ile striatum arasındaki bağlantının güçlü olduğu kişilerde daha belirgindi", "label": "🔵", "src": "Heller ve ark. 2020, <em>Nature Neuroscience<\/em> · <a href=\"https://www.hartleylab.org/uploads/5/3/1/0/53101939/heller%20_et_al._2020.pdf\" target=\"_blank\" rel=\"noopener\">PDF<\/a>", "added": "2026-11-04"}, {"id": "b-evrenin-ilk-sesi-baryon-akustik-salinimlari", "kind": "fact", "title": "Evrenin ilk sesi (baryon akustik salınımları)", "front": "Evrenin ilk ses dalgaları bugün galaksilerin dağılımında nasıl bir iz bıraktı?", "ask": "Bilim defterimden: “Evrenin ilk sesi (baryon akustik salınımları)”. İlk ~380 bin yılda evren sıcak bir plazmaydı ve içinde ses dalgaları yayılıyordu. Dalgalar donduğunda galaksilerin dağılımında bir iz kaldı: galaksiler birbirinden ~490 milyon ışık yılı uzakta biraz daha sık bulunuyor. 2005'te 46.748 galaksiyle ölçüldü Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "fizik-ve-astronomi", "secn": "Fizik ve astronomi", "back": "İlk ~380 bin yılda evren sıcak bir plazmaydı ve içinde ses dalgaları yayılıyordu. Dalgalar donduğunda galaksilerin dağılımında bir iz kaldı: galaksiler birbirinden ~490 milyon ışık yılı uzakta biraz daha sık bulunuyor. 2005'te 46.748 galaksiyle ölçüldü", "label": "🟢", "src": "Eisenstein ve ark. 2005, <em>ApJ<\/em> 633:560 · <a href=\"https://arxiv.org/abs/astro-ph/0501171\" target=\"_blank\" rel=\"noopener\">arXiv<\/a> · ayrıca Cole ve ark. 2005 (2dF)", "added": "2026-11-04"}, {"id": "b-gercek-olan-newtonun-simyasi", "kind": "fact", "title": "Gerçek olan: Newton'un simyası", "front": "Newton simya üzerine ne kadar yazdı ve Keynes onu nasıl tanımladı?", "ask": "Bilim defterimden: “Gerçek olan: Newton'un simyası”. Newton simya üzerine yaklaşık bir milyon kelime yazdı. Keynes 1936'da bu kâğıtları satın aldı ve Newton'u \"aklın çağının ilki değil, büyücülerin sonuncusu\" diye andı. Bugünkü tarihçiler simyayı kimyanın öncüsü sayıyor Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Newton simya üzerine yaklaşık bir milyon kelime yazdı. Keynes 1936'da bu kâğıtları satın aldı ve Newton'u \"aklın çağının ilki değil, büyücülerin sonuncusu\" diye andı. Bugünkü tarihçiler simyayı kimyanın öncüsü sayıyor", "label": "🟢", "src": "<a href=\"https://www.neh.gov/humanities/2011/januaryfebruary/feature/newton-the-last-magician\" target=\"_blank\" rel=\"noopener\">NEH, \"Newton the Last Magician\" (2011)<\/a> · Newman, <em>Newton the Alchemist<\/em> (2019)", "added": "2026-11-04"}, {"id": "b-guvenilirler-ve-maceracilar", "kind": "fact", "title": "Güvenilirler ve maceracılar", "front": "Plog&#x27;un turizm modelindeki iki uç ne ve modelin bilinen zayıflığı ne?", "ask": "Bilim defterimden: “Güvenilirler ve maceracılar”. Turizmde iki uç: tanıdık yeri seçenler ve yenisini arayanlar. Eleştirisi: insanlar duruma göre tip değiştiriyor Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "psikoloji-ve-davranis", "secn": "Psikoloji ve davranış", "back": "Turizmde iki uç: tanıdık yeri seçenler ve yenisini arayanlar. Eleştirisi: insanlar duruma göre tip değiştiriyor", "label": "🔵 zayıf", "src": "Plog 1974 · <a href=\"https://rd.springer.com/referenceworkentry/10.1007/978-3-319-01384-8_5\" target=\"_blank\" rel=\"noopener\">Springer<\/a>", "added": "2026-11-04"}, {"id": "b-kara-deligin-notasi-perseus-kumesi", "kind": "fact", "title": "Kara deliğin notası (Perseus kümesi)", "front": "Perseus kümesindeki kara delik hangi notayı çalıyor ve bu nota orta do&#x27;nun kaç oktav altında?", "as , ama açıkça ve bir kraliçenin kendi isteğiyle", "label": "🟢", "src": "<a href=\"https://en.wikipedia.org/wiki/John_Dee\" target=\"_blank\" rel=\"noopener\">Wikipedia: John Dee<\/a>", "added": "2026-11-04"}, {"id": "b-forer-etkisi", "kind": "fact", "title": "Forer etkisi", "front": "Herkese aynı genel kişilik yorumu verilince ne oluyor ve bu, falın &quot;beni bildi&quot; hissini nasıl açıklıyor?", "ask": "Bilim defterimden: “Forer etkisi”. Herkese aynı genel kişilik yorumu verildi; çoğu kişi \"tam bana göre\" dedi. Defalarca tekrarlandı. Falın ve astrolojinin \"beni bildi\" hissinin mekanizması budur Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "psikoloji-ve-davranis", "secn": "Psikoloji ve davranış", "back": "Herkese aynı genel kişilik yorumu verildi; çoğu kişi \"tam bana göre\" dedi. Defalarca tekrarlandı. Falın ve astrolojinin \"beni bildi\" hissinin mekanizması budur", "label": "🟢", "src": "Forer 1949 · <a href=\"https://en.wikipedia.org/wiki/Barnum_effect\" target=\"_blank\" rel=\"noopener\">Wikipedia<\/a>", "added": "2026-11-04"}, {"id": "b-kutlecekim-dalgasinin-civiltisi", "kind": "fact", "title": "Kütleçekim dalgasının \"cıvıltısı\"", "front": "LIGO&#x27;nun 2015&#x27;te ölçtüğü kütleçekim dalgası sese çevrilince neden kulağa bir &quot;cıvıltı&quot; gibi geliyor?", "ask": "Bilim defterimden: “Kütleçekim dalgasının \"cıvıltısı\"”. 2015'te LIGO, 1,3 milyar yıl önce birleşen iki kara deliğin uzay-zamanda yarattığı dalgayı ölçtü. Frekans 35 Hz'den 250 Hz'e çıkıyor, yani insan kulağının duyabileceği aralıkta. Sese çevrilince bir \"chirp\" gibi duyuluyor Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "fizik-ve-astronomi", "secn": "Fizik ve astronomi", "back": "2015'te LIGO, 1,3 milyar yıl önce birleşen iki kara deliğin uzay-zamanda yarattığı dalgayı ölçtü. Frekans 35 Hz'den 250 Hz'e çıkıyor, yani insan kulağının duyabileceği aralıkta. Sese çevrilince bir \"chirp\" gibi duyuluyor", "label": "🟢", "src": "<a href=\"https://www.ligo.caltech.edu/news/ligo20160211\" target=\"_blank\" rel=\"noopener\">LIGO, 2016<\/a>", "added": "2026-11-04"}, {"id": "b-gercek-olan-medici-ve-hermes-metinleri", "kind": "fact", "title": "Gerçek olan: Medici ve Hermes metinleri", "front": "Ficino Hermes metinlerini neden Platon&#x27;dan önce çevirdi ve Casaubon 1614&#x27;te ne gösterdi?", "ask": "Bilim defterimden: “Gerçek olan: Medici ve Hermes metinleri”. Cosimo de' Medici, Ficino'ya Platon çevirisini bıraktırıp önce yeni gelen Hermes metinlerini çevirtti (1463 civarı); onları Musa çağından kalma sanıyorlardı. 1614'te Isaac Casaubon dil analiziyle metinlerin MS 100–300 civarında yazıldığını gösterdi Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Cosimo de' Medici, Ficino'ya Platon çevirisini bıraktırıp önce yeni gelen Hermes metinlerini çevirtti (1463 civarı); onları Musa çağından kalma sanıyorlardı. 1614'te Isaac Casaubon dil analiziyle metinlerin MS 100–300 civarında yazıldığını gösterdi", "label": "🟢", "src": "<a href=\"https://en.wikipedia.org/wiki/Corpus_Hermeticum\" target=\"_blank\" rel=\"noopener\">Wikipedia: Corpus Hermeticum<\/a>", "added": "2026-11-04"}, {"id": "b-zaman-satin-almak-mutlu-ediyor", "kind": "fact", "title": "Zaman satın almak mutlu ediyor", "front": "Zaman kazandıran bir harcama ile eşya harcaması karşılaştırılınca hangisi daha iyi hissettirdi?", "ask": "Bilim defterimden: “Zaman satın almak mutlu ediyor”. Zaman kazandıran bir harcama, eşya harcamasından daha çok iyi hissettirdi (anketler ve bir alan deneyi) Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "psikoloji-ve-davranis", "secn": "Psikoloji ve davranış", "back": "Zaman kazandıran bir harcama, eşya harcamasından daha çok iyi hissettirdi (anketler ve bir alan deneyi)", "label": "🟢 tek alan deneyi", "src": "Whillans ve ark. 2017, <em>PNAS<\/em> 114(32)", "added": "2026-11-04"}, {"id": "b-paralel-evrenler-1-cok-dunyalar-yorumu", "kind": "fact", "title": "Paralel evrenler 1: çok-dünyalar yorumu", "front": "Çok-dünyalar yorumu ne söylüyor ve neden deneyle öbür yorumlardan ayırt edilemiyor?", "ask": "Bilim defterimden: “Paralel evrenler 1: çok-dünyalar yorumu”. Kuantum mekaniğinin bir yorumu: her ölçümde evren dallanır ve her sonuç ayrı bir dalda gerçekleşir (Everett 1957). Standart kuantum mekaniğiyle aynı tahminleri verdiği için deneyle öbür yorumlardan ayırt edilemiyor Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "fizik-ve-astronomi", "secn": "Fizik ve astronomi", "back": "Kuantum mekaniğinin bir yorumu: her ölçümde evren dallanır ve her sonuç ayrı bir dalda gerçekleşir (Everett 1957). Standart kuantum mekaniğiyle aynı tahminleri verdiği için deneyle öbür yorumlardan ayırt edilemiyor", "label": "🟡", "src": "<a href=\"https://en.wikipedia.org/wiki/Many-worlds_interpretation\" target=\"_blank\" rel=\"noopener\">Wikipedia<\/a>", "added": "2026-11-04"}, {"id": "b-jung-ve-i-ching-eszamanlilik", "kind": "fact", "title": "Jung ve I Ching: eşzamanlılık", "front": "Jung &quot;eşzamanlılık&quot; kavramını neyi açıklamak için kurdu?", "ask": "Bilim defterimden: “Jung ve I Ching: eşzamanlılık”. Reel (@bidileyy, 9 bin beğeni): Jung I Ching'i bir kehanet değil, bilinçdışını keşfetme aracı olarak gördü. Soru sorulur, çubuk ya da para atılır, 64 heksagramdan biri çıkar. Jung'u ilgilendiren hangi heksagramın çıktığı değil, neden tam o anda o heksagramın çıktığıydı. Bunu açık Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Reel (@bidileyy, 9 bin beğeni): Jung I Ching'i bir kehanet değil, bilinçdışını keşfetme aracı olarak gördü. Soru sorulur, çubuk ya da para atılır, 64 heksagramdan biri çıkar. Jung'u ilgilendiren hangi heksagramın çıktığı değil, neden tam o anda o heksagramın çıktığıydı. Bunu açıklamak için <strong>eşzamanlılık<\/strong> kavramını kurdu: aralarında neden-sonuç bağı olmayan ama anlamlı biçimde denk düşen olaylar. Terimi ilk kez 1930'da Wilhelm'in anma konuşmasında kullandı, 1952'de bir makaleye dönüştürdü. I Ching'e yazdığı ön sözde (1949) 30 yılı aşkın süredir bu yöntemle ilgilendiğini ve bir bilim insanı olarak bunu yazmaktan rahatsız olduğunu söyler. Ona göre Batı \"nedeni ne?\", eski Çin \"bunlar aynı anda oluyorsa bana ne söylüyor?\" diye sorar", "label": "🟢 (Jung&#x27;un yazdıkları belgeli; kavramın kendisi aşağıda)", "src": "<a href=\"https://www.encyclopedia.com/philosophy-and-religion/other-religious-beliefs-and-general-terms/miscellaneous-religion-45\" target=\"_blank\" rel=\"noopener\">Encyclopedia.com: Synchronicity<\/a> · Wilhelm/Baynes, <em>The I Ching<\/em> (1950), Jung'un ön sözü · reel", "added": "2026-11-04"}, {"id": "b-olumlu-hayal-enerjiyi-dusuruyor", "kind": "fact", "title": "Olumlu hayal enerjiyi düşürüyor", "front": "İstediğin geleceği sadece olumlu hayal etmek enerjini nasıl etkiliyor?", "ask": "Bilim defterimden: “Olumlu hayal enerjiyi düşürüyor”. İnsanlara istedikleri geleceği olumlu hayal ettirildi; enerjileri (tansiyon ve davranış ölçüleri) sorgulayan, olumsuz ya da nötr hayal kuranlardan daha düşük çıktı. İhtiyaç ne kadar acilse düşüş o kadar büyüktü. Yani \"sadece iste ve hisset\" yaklaşımı harekete geçirmiyor, tersine  Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "psikoloji-ve-davranis", "secn": "Psikoloji ve davranış", "back": "İnsanlara istedikleri geleceği olumlu hayal ettirildi; enerjileri (tansiyon ve davranış ölçüleri) sorgulayan, olumsuz ya da nötr hayal kuranlardan <strong>daha düşük<\/strong> çıktı. İhtiyaç ne kadar acilse düşüş o kadar büyüktü. Yani \"sadece iste ve hisset\" yaklaşımı harekete geçirmiyor, tersine dinlendiriyor", "label": "🟢 4 deney, aynı laboratuvar", "src": "Kappes ve Oettingen 2011, <em>JESP<\/em> 47(4):719–729 · <a href=\"https://www.psy.uni-hamburg.de/arbeitsbereiche/paedagogische-psychologie-und-motivation/personen/oettingen-gabriele/dokumente/kappes-oettingen-2011.pdf\" target=\"_blank\" rel=\"noopener\">PDF<\/a>", "added": "2026-11-04"}, {"id": "b-paralel-evrenler-2-sisme-coklu-evreni", "kind": "fact", "title": "Paralel evrenler 2: şişme çoklu evreni", "front": "Şişme çoklu evreni nasıl test edilebilir ve aranan iz bulundu mu?", "ask": "Bilim defterimden: “Paralel evrenler 2: şişme çoklu evreni”. Bazı kozmik şişme modellerinde şişme hiç durmuyor ve sonsuz sayıda \"kabarcık evren\" üretiyor. Test önerisi var: başka bir kabarcıkla çarpışmanın gökyüzünde bırakacağı iz. Aranmış, bulunmamış Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "fizik-ve-astronomi", "secn": "Fizik ve astronomi", "back": "Bazı kozmik şişme modellerinde şişme hiç durmuyor ve sonsuz sayıda \"kabarcık evren\" üretiyor. Test önerisi var: başka bir kabarcıkla çarpışmanın gökyüzünde bırakacağı iz. Aranmış, bulunmamış", "label": "🟡", "src": "<a href=\"https://en.wikipedia.org/wiki/Multiverse\" target=\"_blank\" rel=\"noopener\">Wikipedia<\/a>", "added": "2026-11-04"}, {"id": "m-wilhelm-i-chingi-ingilizceye-cevirdi", "kind": "myth", "title": "", "front": "\"Wilhelm I Ching'i İngilizceye çevirdi\"", "ask": "Şu iddiayı kontrol et: \"Wilhelm I Ching'i İngilizceye çevirdi\". Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Almancaya çevirdi (1924). İngilizce baskı, Cary F. Baynes'in Wilhelm'in Almancasından yaptığı çeviri (1950); Jung'un ön sözü o baskıda. Jung, Wilhelm'le 1920'lerin başında tanıştı", "label": "🔴", "src": "<a href=\"https://abaa.org/book/1535378748\" target=\"_blank\" rel=\"noopener\">ABAA, 1950 ilk baskı<\/a> · <a href=\"https://wisdomportal.com/IChing/IChing-Wilhelm.html\" target=\"_blank\" rel=\"noopener\">Wisdom Portal<\/a>", "added": "2026-11-04"}, {"id": "b-woop-hayal-engel-plan", "kind": "fact", "title": "WOOP: hayal + engel + plan", "front": "WOOP&#x27;un adımları ne ve 21 çalışmalık meta-analizde etkisi ne kadar çıktı?", "ask": "Bilim defterimden: “WOOP: hayal + engel + plan”. İsteği hayal et, sonra önündeki iç engeli düşün, sonra \"eğer X olursa Y yaparım\" planı yaz (mental contrasting + implementation intentions, MCII). 21 çalışma, ~15.900 kişi: hedefe ulaşmada küçük-orta bir etki. Yüz yüze uygulanınca etki daha büyük. Yazarlar yayın yanlılığı uyarıyo Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "psikoloji-ve-davranis", "secn": "Psikoloji ve davranış", "back": "İsteği hayal et, sonra önündeki <strong>iç engeli<\/strong> düşün, sonra \"eğer X olursa Y yaparım\" planı yaz (mental contrasting + implementation intentions, MCII). 21 çalışma, ~15.900 kişi: hedefe ulaşmada küçük-orta bir etki. Yüz yüze uygulanınca etki daha büyük. Yazarlar yayın yanlılığı uyarıyor, gerçek etki biraz daha küçük olabilir", "label": "🟢 meta-analiz", "src": "Wang, Wang ve Gai 2021, <em>Frontiers in Psychology<\/em> 12:565202 · <a href=\"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8149892/\" target=\"_blank\" rel=\"noopener\">PMC<\/a>", "added": "2026-11-04"}, {"id": "m-evrenler-arasi-frekanslar", "kind": "myth", "title": "", "front": "\"Evrenler arası frekanslar\"", "ask": "Şu iddiayı kontrol et: \"Evrenler arası frekanslar\". Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "fizik-ve-astronomi", "secn": "Fizik ve astronomi", "back": "Fizikte böyle bir kavram yok. Çok-dünyalarda dallar birbirini etkileyemez. Şişme modelindeki tek olası temas bir çarpışma izi; o da bir frekans değil ve bulunmadı. Kavram ruhani içeriklerden geliyor", "label": "🔴", "src": "", "added": "2026-11-04"}, {"id": "m-44-heksagram-boyle-bir-kadinla-evlenilmeli-dedi", "kind": "myth", "title": "", "front": "\"44. heksagram 'böyle bir kadınla evlenilmeli' dedi\"", "ask": "Şu iddiayı kontrol et: \"44. heksagram 'böyle bir kadınla evlenilmeli' dedi\". Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Tersini diyor. Wilhelm'in çevirisi: \"Kız güçlüdür. Böyle bir kızla evlenilmemeli.\" Çince aslı: 女壯，勿用取女 (\"kadın güçlü; onu alma\"). Hikâye ancak böyle anlamlı: Jung danışanın kararsızlığını bir anne kompleksine bağlıyordu, kehanet de \"evlenme\" dedi", "label": "🔴", "src": "<a href=\"https://www.masterseanchan.com/iching-hexagram-44-gou/\" target=\"_blank\" rel=\"noopener\">Wilhelm metni ve Çincesi<\/a> · <a href=\"https://www.encyclopedia.com/philosophy-and-religion/other-religious-beliefs-and-general-terms/miscellaneous-religion-45\" target=\"_blank\" rel=\"noopener\">Encyclopedia.com: Synchronicity<\/a>", "added": "2026-11-04"}, {"id": "m-duygular-frekans-yayar-korku-100-hz-kesinlik-600-hz-600de-ge", "kind": "myth", "title": "", "front": "\"Duygular frekans yayar: korku 100 Hz, kesinlik 600 Hz; 600'de gerçeklik etrafında yeniden düzenlenir\" (reel, @unconsciousdepths2, 67 bin beğeni)", "ask": "Şu iddiayı kontrol et: \"Duygular frekans yayar: korku 100 Hz, kesinlik 600 Hz; 600'de gerçeklik etrafında yeniden düzenlenir\" (reel, @unconsciousdepths2, 67 bin beğeni). Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "psikoloji-ve-davranis", "secn": "Psikoloji ve davranış", "back": "Kaynak diye gösterilen David Hawkins <strong>fizikçi değil, psikiyatristti<\/strong>. <em>Power vs. Force<\/em> (1995) kitabındaki \"bilinç haritası\" 1–1000 arası logaritmik bir ölçek; sayılar <strong>hertz değil<\/strong>, kas testiyle (applied kinesiology) verilmiş. Elektromanyetik ölçüm yok. Haritada 600 \"kesinlik\" değil \"huzur\" (peace), korku 100. Kas testi kör denemede şansa eşit çıktı: 151 denemede zehirli şişe %53 doğru bulundu (şans %50)", "label": "🔴", "src": "Hawkins'in yayınevi: <a href=\"https://veritaspub.com/map-of-consciousness/\" target=\"_blank\" rel=\"noopener\">veritaspub.com<\/a> · Schwartz ve ark. 2014, <em>Explore<\/em> 10(2):99–108 · <a href=\"https://pubmed.ncbi.nlm.nih.gov/24607076/\" target=\"_blank\" rel=\"noopener\">PubMed<\/a>", "added": "2026-11-04"}, {"id": "m-432-hz-evrenin-akordu", "kind": "myth", "title": "", "front": "432 Hz \"evrenin akordu\"", "ask": "Şu iddiayı kontrol et: 432 Hz \"evrenin akordu\". Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "fizik-ve-astronomi", "secn": "Fizik ve astronomi", "back": "La = 440 Hz bir uzlaşı (1939 Londra konferansı, sonra ISO 16). 432 Hz'in \"doğal\" ya da şifalı olduğuna dair kanıt, aynı ekibin küçük pilot çalışmalarından ibaret", "label": "🔴", "src": "Calamassi ve Pomponi 2019, <em>Explore<\/em> 15(4):283 (pilot çalışma)", "added": "2026-11-04"}, {"id": "m-eszamanlilik-bos-bir-tesaduf-degil", "kind": "myth", "title": "", "front": "\"Eşzamanlılık boş bir tesadüf değil\"", "ask": "Şu iddiayı kontrol et: \"Eşzamanlılık boş bir tesadüf değil\". Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Jung'un kuramı; test edilebilir bir öngörüsü yok. İstatistik, çarpıcı tesadüflerin zaten beklenen şeyler olduğunu gösteriyor: örnek yeterince büyükse en tuhaf olay da gerçekleşir (\"çok büyük sayılar yasası\"). \"Tam onu düşünürken aradı\" anı hatırlanır; düşündüğün hâlde aramadığı yüzlerce an unutulur", "label": "🟡 kuram · istatistik 🟢", "src": "Diaconis &amp; Mosteller 1989, \"Methods for Studying Coincidences\", <em>JASA<\/em> 84(408):853–861 (<a href=\"https://www.jstor.org/stable/2290058\" target=\"_blank\" rel=\"noopener\">JSTOR<\/a>)", "added": "2026-11-04"}, {"id": "b-dopamin-odul-tahmin-hatasi", "kind": "fact", "title": "Dopamin: ödül tahmin hatası", "front": "Schultz&#x27;un maymun deneyinde dopamin nöronları ödülün kendisini mi kodluyor, yoksa başka bir şeyi mi? Beklenen ödül gelmeyince ne oluyor?", "ask": "Bilim defterimden: “Dopamin: ödül tahmin hatası”. Maymunlara bir ışık yandıktan sonra meyve suyu verildi. Başta dopamin nöronları suyun kendisine ateşlendi. Işığın suyu haber verdiğini öğrenince ateşleme ışığa kaydı, suya tepki kalmadı. Beklenen su gelmeyince ateşleme taban seviyenin altına düştü. Yani dopamin ödülün kendisini d Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "psikoloji-ve-davranis", "secn": "Psikoloji ve davranış", "back": "Maymunlara bir ışık yandıktan sonra meyve suyu verildi. Başta dopamin nöronları suyun kendisine ateşlendi. Işığın suyu haber verdiğini öğrenince ateşleme ışığa kaydı, suya tepki kalmadı. Beklenen su gelmeyince ateşleme taban seviyenin altına düştü. Yani dopamin ödülün kendisini değil, <strong>beklenti ile gerçek arasındaki farkı<\/strong> kodluyor. Aynı hesap, makinelerin deneme-yanılmayla öğrendiği yöntemdeki (temporal difference learning) hata sinyaliyle birebir örtüşüyor", "label": "🟢", "src": "Schultz, Dayan ve Montague 1997, <em>Science<\/em> 275:1593–1599 · <a href=\"https://pubmed.ncbi.nlm.nih.gov/9054347/\" target=\"_blank\" rel=\"noopener\">PubMed<\/a>", "added": "2026-11-23"}, {"id": "b-fourier-her-ses-sinuslerin-toplami", "kind": "fact", "title": "Fourier: her ses sinüslerin toplamı", "front": "Fourier&#x27;nin bulduğu şey ne ve Ableton&#x27;daki spektrum analizörü bununla ne gösteriyor?", "ask": "Bilim defterimden: “Fourier: her ses sinüslerin toplamı”. Ne kadar karmaşık olursa olsun her periyodik dalga, farklı frekans ve şiddetteki saf sinüs dalgalarının toplamına ayrılabilir; periyodik olmayan sesler için Fourier dönüşümü aynı işi yapar. Joseph Fourier bunu ısının yayılmasını incelerken buldu (1807 sunumu, 1822 kitabı). Bilgis Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "fizik-ve-astronomi", "secn": "Fizik ve astronomi", "back": "Ne kadar karmaşık olursa olsun her periyodik dalga, farklı frekans ve şiddetteki saf sinüs dalgalarının toplamına ayrılabilir; periyodik olmayan sesler için Fourier dönüşümü aynı işi yapar. Joseph Fourier bunu ısının yayılmasını incelerken buldu (1807 sunumu, 1822 kitabı). Bilgisayarın bunu anında yapmasını sağlayan algoritma (FFT) 1965'te yayımlandı. Ableton'daki spektrum analizörü ve EQ ekranı tam olarak bunu gösteriyor: bir kick'in hangi frekanslardan oluştuğunu", "label": "🟢 matematik teoremi", "src": "Fourier, <em>Théorie analytique de la chaleur<\/em> (1822) · Cooley ve Tukey 1965 · <a href=\"https://www.youtube.com/watch?v=spUNpyF58BY\" target=\"_blank\" rel=\"noopener\">3Blue1Brown, görsel anlatım<\/a>", "added": "2026-11-23"}, {"id": "m-kayip-25-sayfa", "kind": "myth", "title": "", "front": "Kayıp 25. sayfa", "ask": "Şu iddiayı kontrol et: Kayıp 25. sayfa. Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Belgenin 25. sayfası CIA yayınında yok; komplo anlatılarının yakıtı bu. Black Vault 2021'de ve Aralık 2023'te yeniden aratmak için başvurdu; CIA sayfayı bulamadı ve INSCOM'a başvurmayı önerdi", "label": "🟢", "src": "<a href=\"https://www.theblackvault.com/documentarchive/stargate-collection-analysis-and-assessment-of-gateway-process-9-june-1983/\" target=\"_blank\" rel=\"noopener\">Black Vault<\/a>", "added": "2026-11-04"}, {"id": "m-dopamin-detoksu-telefonu-sekeri-muzigi-birakinca-dopamin-sev", "kind": "myth", "title": "", "front": "\"Dopamin detoksu: telefonu, şekeri, müziği bırakınca dopamin seviyen sıfırlanır\"", "ask": "Şu iddiayı kontrol et: \"Dopamin detoksu: telefonu, şekeri, müziği bırakınca dopamin seviyen sıfırlanır\". Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "psikoloji-ve-davranis", "secn": "Psikoloji ve davranış", "back": "Yöntemi ortaya atan psikiyatr Cameron Sepah (2019) dopamini düşürmeyi kastetmedi; adın dikkat çekmek için konduğunu kendisi söyledi. Kendi tanımı bilişsel davranışçı terapiden bir teknik: sorun yaratan <strong>tek bir alışkanlığa<\/strong> belli saatlerde ara vermek. Dopamin, uyarandan uzak durunca boşalıp dolan bir depo değil; sağlıklı etkinlikler de dopamin salgılatır. Harvard Health'teki eleştiri: insanlardan bile uzak durmaya varan aşırı versiyonlar bilimin yanlış anlaşılmasından çıktı", "label": "🔴", "src": "<a href=\"https://www.health.harvard.edu/blog/dopamine-fasting-misunderstanding-science-spawns-a-maladaptive-fad-2020022618917\" target=\"_blank\" rel=\"noopener\">Harvard Health, Grinspoon 2020<\/a> · <a href=\"https://en.wikipedia.org/wiki/Dopamine_fasting\" target=\"_blank\" rel=\"noopener\">Wikipedia<\/a>", "added": "2026-11-23"}, {"id": "b-oda-modlari-odanin-kendi-bas-notalari", "kind": "fact", "title": "Oda modları: odanın kendi bas notaları", "front": "4 metrelik bir odanın ilk oda modu kaç Hz&#x27;e düşer ve bunu hangi formülle hesaplarsın?", "ask": "Bilim defterimden: “Oda modları: odanın kendi bas notaları”. Bas dalgaları karşılıklı duvarlar arasında gidip gelir ve duran dalga oluşturur. İlk notanın frekansı: ses hızı ÷ (2 × duvarlar arası mesafe). 4 metrelik bir odada 343 ÷ 8 ≈ 43 Hz, sonra katları: 86 ve 129 Hz. Bu frekanslarda bas odanın bazı noktalarında çok güçlü, bazılarında ne Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "fizik-ve-astronomi", "secn": "Fizik ve astronomi", "back": "Bas dalgaları karşılıklı duvarlar arasında gidip gelir ve duran dalga oluşturur. İlk notanın frekansı: ses hızı ÷ (2 × duvarlar arası mesafe). 4 metrelik bir odada 343 ÷ 8 ≈ 43 Hz, sonra katları: 86 ve 129 Hz. Bu frekanslarda bas odanın bazı noktalarında çok güçlü, bazılarında neredeyse yok duyulur; birkaç adım yer değiştirince kick'in gücü değişir. En güçlüleri karşılıklı iki duvar arasındakiler (eksen modları). Küçük odada modlar seyrek düştüğü için bas eşitsiz duyulur", "label": "🟢", "src": "<a href=\"https://cmtext.indiana.edu/acoustics/chapter1_standing2.php\" target=\"_blank\" rel=\"noopener\">Indiana Ü., akustik ders kitabı<\/a> · <a href=\"https://sengpielaudio.com/calculator-roommodes.htm\" target=\"_blank\" rel=\"noopener\">sengpielaudio oda modu hesaplayıcı<\/a>", "added": "2026-11-23"}, {"id": "m-sonuc-ordunun-psisik-programi-ne-oldu", "kind": "myth", "title": "", "front": "Sonuç: ordunun psişik programı ne oldu", "ask": "Şu iddiayı kontrol et: Sonuç: ordunun psişik programı ne oldu. Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Gateway notu, ordunun uzaktan görme (remote viewing) programlarının dosyalarında duruyor; bu programlar sonradan Stargate adını aldı. CIA 1995'te bağımsız değerlendirme ısmarladı (American Institutes for Research). Rapor şu sonuca vardı: uzaktan görmenin istihbaratta kullanılmaya devam etmesi gerekçelendirilemez; laboratuvardaki etkilerin psişik bir yeteneğe bağlandığı da açık değil. Program aynı yıl kapatıldı", "label": "🟢", "src": "AIR 1995, Mumford, Rose &amp; Goslin · <a href=\"https://www.cia.gov/readingroom/print/304505\" target=\"_blank\" rel=\"noopener\">CIA okuma odası<\/a> · <a href=\"https://en.wikipedia.org/wiki/Stargate_Project\" target=\"_blank\" rel=\"noopener\">Wikipedia: Stargate<\/a>", "added": "2026-11-04"}, {"id": "b-yalnizlik-salgini-ve-yalniz-kalma", "kind": "fact", "title": "\"Yalnızlık salgını\" ve yalnız kalma", "front": "Genç yetişkinlerde yalnızlık 1976–2019 arasında ne kadar arttı ve Mastroianni&#x27;ye göre asıl artan şey ne?", "ask": "Bilim defterimden: “\"Yalnızlık salgını\" ve yalnız kalma”. 1976–2019 arasında UCLA Yalnızlık Ölçeği'ni dolduran 124.855 genç yetişkinin verisi birleştirildi (345 çalışma, önceden kayıtlı meta-analiz). Yalnızlık hafifçe arttı: 43 yılda 0,56 standart sapma. Yazarların kendi yorumu: \"salgın\" kelimesi abartı. Bazı zaman karşılaştırmaları ter Bu bulguyu biraz daha aç: nasıl ölçüldü, kanıt ne kadar güçlü, karşı görüş ne? Türkçe, kısa, kaynak göster.", "sec": "psikoloji-ve-davranis", "secn": "Psikoloji ve davranış", "back": "1976–2019 arasında UCLA Yalnızlık Ölçeği'ni dolduran 124.855 genç yetişkinin verisi birleştirildi (345 çalışma, önceden kayıtlı meta-analiz). Yalnızlık hafifçe arttı: 43 yılda 0,56 standart sapma. Yazarların kendi yorumu: \"salgın\" kelimesi abartı. Bazı zaman karşılaştırmaları ters sonuç buluyor (bir 2015 çalışmasında ABD liselilerinde düşüş). Adam Mastroianni'nin tezi: artan şey yalnızlık <em>hissi<\/em> değil, yalnız <em>geçirilen zaman<\/em>. İnsan C vitamini eksikken portakal canı çekmediği gibi, arkadaş eksikken de güçlü bir arkadaş isteği duymuyor; buna \"sosyal iskorbüt\" diyor", "label": "🔵 meta-analiz · &quot;sosyal iskorbüt&quot; bir yorum", "src": "Buecker ve ark. 2021, <em>Psychological Bulletin<\/em> 147:787–805 · <a href=\"https://pubmed.ncbi.nlm.nih.gov/34898234/\" target=\"_blank\" rel=\"noopener\">PubMed<\/a> · <a href=\"https://www.experimental-history.com/p/there-is-no-epidemic-of-loneliness\" target=\"_blank\" rel=\"noopener\">Experimental History, 2026-09-15<\/a>", "added": "2026-11-23"}, {"id": "m-beyin-dalgalari-esitlenince-bilinc-baska-boyuta-gecer-hemi-s", "kind": "myth", "title": "", "front": "\"Beyin dalgaları eşitlenince bilinç başka boyuta geçer\" (Hemi-Sync)", "ask": "Şu iddiayı kontrol et: \"Beyin dalgaları eşitlenince bilinç başka boyuta geçer\" (Hemi-Sync). Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Hemi-Sync'in dayanağı binaural vuruş: iki kulağa biraz farklı frekansta ses verilince beyin aradaki farkı bir vuruş olarak duyar. Beyin dalgalarını bu frekansa çektiği iddiası EEG'de tutarlı biçimde gösterilemedi; 14 çalışmalık sistematik derleme kanıtı \"en iyi ihtimalle sonuçsuz\" buldu. Davranışta ise iz var: bir meta-analiz bellek, dikkat, kaygı ve ağrı algısında orta düzeye yakın bir etki buldu; akut ağrıda da umut verici sonuçlar var. Başka boyuta geçişe dair ölçüm yok", "label": "🔵 dikkat/ağrı · 🔴 boyut", "src": "Ingendoh ve ark. 2023, <em>PLOS ONE<\/em> · <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10198548/\" target=\"_blank\" rel=\"noopener\">PMC<\/a> · Garcia-Argibay ve ark. 2019, <em>Psychological Research<\/em> 83:357–372 · ağrı derlemesi 2024, <em>BMC Complement Med Ther<\/em> · <a href=\"https://bmccomplementmedtherapies.biomedcentral.com/articles/10.1186/s12906-024-04339-y\" target=\"_blank\" rel=\"noopener\">makale<\/a>", "added": "2026-11-04"}, {"id": "m-beden-disi-deneyim-obe", "kind": "myth", "title": "", "front": "Beden dışı deneyim (OBE)", "ask": "Şu iddiayı kontrol et: Beden dışı deneyim (OBE). Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Deneyim gerçek ve beyinde üretilebiliyor. Epilepsi ameliyatı öncesi sağ angular girusu (temporoparietal bölge) elektrikle uyarılan bir hasta \"kendimi yukarıdan, yatakta yatarken görüyorum\" dedi. Açıklama: beyin bedenin konumunu denge ve dokunma sinyallerinden kuruyor, bu birleştirme bozulunca \"dışarıdan bakış\" oluşuyor. Başka bir yere gidildiğine dair doğrulanmış bir bilgi yok", "label": "🟢 deneyim · 🔴 &quot;boyut atlama&quot;", "src": "Blanke ve ark. 2002, <em>Nature<\/em> 419:269–270 · <a href=\"https://infoscience.epfl.ch/record/154908/files/2002_Blanke_N_stimulating%20illusory%20own-body%20perceptions.pdf\" target=\"_blank\" rel=\"noopener\">EPFL PDF<\/a>", "added": "2026-11-04"}, {"id": "m-kati-madde-yok-her-sey-titresim", "kind": "myth", "title": "", "front": "\"Katı madde yok, her şey titreşim\"", "ask": "Şu iddiayı kontrol et: \"Katı madde yok, her şey titreşim\". Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Yarı doğru, ama varılan sonuç yanlış. Fizikte parçacıklar alanların uyarımı olarak tarif edilir ve atomun hacminin neredeyse tamamı boşluktur. Masanın katı olması ise yanılsama değil: elektronların aynı durumu paylaşamaması (Pauli dışarlama ilkesi) ve elektrik itmesi onu katı yapar. Bundan \"bilinç gerçekliği yaratır\" sonucu çıkmaz. Belgedeki \"hologram\" Pribram'ın kenarda kalmış beyin modeli; fizikteki holografik ilke (kara delikler) bambaşka bir şey", "label": "🟢 fizik · 🔴 sonuç", "src": "Standart fizik", "added": "2026-11-04"}, {"id": "m-gercek-olan-dunyayi-beyin-kuruyor", "kind": "myth", "title": "", "front": "Gerçek olan: \"dünyayı beyin kuruyor\"", "ask": "Şu iddiayı kontrol et: Gerçek olan: \"dünyayı beyin kuruyor\". Gerçek bulgu ne, iddia nereden çıkıyor? Türkçe, kısa, birincil kaynak göster.", "sec": "tarih-ve-ezoterizm", "secn": "Tarih ve ezoterizm", "back": "Algı konusunda bunun bir doğru tarafı var. Bugünkü sinirbilim algıyı beynin tahmin ürettiği ve duyularla düzelttiği bir süreç olarak modelliyor (öngörüsel işleme; Anil Seth bunu \"kontrollü halüsinasyon\" diye anlatıyor). Ama bu, <em>gördüğün<\/em> dünyanın bir model olduğunu söyler; dışarıda bir dünya olmadığını değil", "label": "🔵", "src": "Seth, <em>Being You<\/em> (2021)", "added": "2026-11-04"}], "brain": {"digest": {"date": "2026-11-28", "items": ["Claude artifacts can now be installed as Mac and Windows apps, in beta on all plans, each with its own icon and window and updating when the artifact changes (×2) (2026-11-25) (<a href=\"https://claude.com/resources/articles/install-as-app\" target=\"_blank\" rel=\"noopener\">ai-newsletters<\/a>)", "An Anthropic proof that VP≠VNP shows the permanent of a 0/1 matrix can't be computed by polynomial-size arithmetic circuits (×2) (2026-11-25) (<a href=\"https://www.
