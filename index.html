f=\"https://luma.com/drqud28k\" target=\"_blank\" rel=\"noopener\">Philosophy Salon with SEE OUR VISION<\/a>", "lane": "🎭", "where": "Emser Str. 124, Berlin", "status": "Free · 20 left"}, {"when": "2026-11-29 15:30", "event": "<a href=\"https://luma.com/6mww6h9c\" target=\"_blank\" rel=\"noopener\">Padel Tournament<\/a>", "lane": "🏋️", "where": "Wittestraße 46, Berlin", "status": "€20 · waitlist"}, {"when": "2026-11-29 18:00", "event": "<a href=\"https://luma.com/jbqrz337\" target=\"_blank\" rel=\"noopener\">Clärchens Ballhaus: Baumloben<\/a>", "lane": "🏋️", "where": "Berlin", "status": "Free · 13 left · approval"}, {"when": "2026-11-30 10:00", "event": "<a href=\"https://luma.com/fight-club-nov-ber\" target=\"_blank\" rel=\"noopener\">Founders Fight Club Berlin by Unicorn Bakery x fertig.ai x SDRs of Germany<\/a>", "lane": "🧠", "where": "Berlin", "status": "Free · 18 left · approval"}, {"when": "2026-11-30 17:00", "event": "<a href=\"https://luma.com/wwjlcdft\" target=\"_blank\" rel=\"noopener\">Berlin Health AI Night: Sovereign AI for Health Data<\/a>", "lane": "🧠", "where": "Berlin", "status": "Free · open · 66 left · approval"}, {"when": "2026-11-30 18:00", "event": "<a href=\"https://luma.com/9wmpkuf4\" target=\"_blank\" rel=\"noopener\">Meet the Machines<\/a>", "lane": "🎭", "where": "Harzer Str. 39, Berlin", "status": "Paid · 1 left · approval"}, {"when": "2026-12-01 15:45", "event": "<a href=\"https://luma.com/h6g5j2fa\" target=\"_blank\" rel=\"noopener\">Studio Hours – gemeinsam an deinen KI-Projekten weiterbauen<\/a>", "lane": "🧠", "where": "Rost- und Silberlaube, Otto-von-Simson-Straße 26, Berlin-Bezirk Stegli", "status": "Free · open · 21 left"}, {"when": "2026-12-01 16:00", "event": "<a href=\"https://luma.com/5a30tz8v\" target=\"_blank\" rel=\"noopener\">Bob DACH Community Gathering &amp; Coding Watch Party Berlin<\/a>", "lane": "🧠", "where": "Sonnenallee 221, Berlin", "status": "Free · open"}], "radar": {"week": "2026-W48", "picks": [{"name": "pierridotite/mobile-agent-testers", "url": "https://github.com/pierridotite/mobile-agent-testers", "verdict": "dene"}, {"name": "Graphify-Labs/graphify", "url": "https://github.com/Graphify-Labs/graphify", "verdict": "izle"}, {"name": "hydra-db/selfgraph", "url": "https://github.com/hydra-db/selfgraph", "verdict": "izle"}, {"name": "avivgerz-hue/vibe-shield", "url": "https://github.com/avivgerz-hue/vibe-shield", "verdict": "dene"}]}}};</script>
<script>
const $=s=>document.querySelector(s);
const LS="bugun-v1";
const S=(()=>{try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}})();
S.srs=S.srs||{};S.fb=S.fb||{};S.saved=S.saved||[];S.seenF=S.seenF||[];S.days=S.days||{};
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const z=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
const TODAY=dkey(new Date());
function addDays(k,n){const [y,m,d]=k.split("-").map(Number);return dkey(new Date(y,m-1,d+n))}
const AY=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const fmtDate=k=>{const [y,m,d]=k.split("-").map(Number);return d+" "+AY[m-1]};
function fmtWhen(w){const k=w.slice(0,10),t=w.slice(11);const lbl=k===TODAY?"Bugün":k===addDays(TODAY,1)?"Yarın":fmtDate(k);return lbl+(t?" "+t:"")}
const DAY=S.days[TODAY]||(S.days[TODAY]={});
Object.keys(S.days).sort().slice(0,-14).forEach(k=>delete S.days[k]);
save();

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
function askClaude(text){
  try{navigator.clipboard&&navigator.clipboard.writeText(text)}catch(e){}
  toast("Soru panoya kopyalandı");
  window.open("https://claude.ai/new?q="+encodeURIComponent(text),"_blank");
}

/* ---------- felsefe ---------- */
const F=DATA.felsefe;
function pickFelsefe(){
  if(!F.length)return null;
  const keep=F.find(n=>n.id===DAY.f); if(keep)return keep;
  const ok=n=>!(S.fb[n.id]&&S.fb[n.id].v===-1);
  let n=F.find(n=>ok(n)&&!S.seenF.includes(n.id));
  if(!n){S.seenF=[];n=F.find(ok)||F[0];}
  S.seenF.push(n.id);DAY.f=n.id;save();return n;
}
function noteHTML(n){
  return `<h2>${n.title}</h2><div class="muted mini">${n.kim}</div>
  <p>${n.fikir}</p>${n.alinti?`<blockquote>${n.alinti}</blockquote>`:""}
  ${n.bugun?`<p><b>Bugün:</b> ${n.bugun}</p>`:""}<p><b>Soru:</b> ${n.soru}</p>
  <div class="src">${n.kaynak}</div>`;
}
function renderFelsefe(){
  const el=$("#felsefe"),n=pickFelsefe();
  if(!n){el.innerHTML='<div class="kick">Günün felsefe notu</div><p class="muted">Havuz henüz boş.</p>';return}
  const fb=(S.fb[n.id]||{}).v,sv=S.saved.includes(n.id);
  el.innerHTML=`<div class="kick">Günün felsefe notu</div>${noteHTML(n)}
  <div class="row"><button class="chip ${fb===1?"on":""}" data-fb="1">👍</button>
  <button class="chip ${fb===-1?"on":""}" data-fb="-1">👎</button>
  <button class="chip ${sv?"on":""}" data-save>${sv?"★ Kaydedildi":"☆ Kaydet"}</button>
  <button class="chip" data-more>Daha fazla ↗</button></div>`;
  el.querySelectorAll("[data-fb]").forEach(b=>b.onclick=()=>{const v=+b.dataset.fb;
    S.fb[n.id]=(S.fb[n.id]||{}).v===v?{v:0,t:TODAY}:{v,t:TODAY};save();renderFelsefe()});
  el.querySelector("[data-save]").onclick=()=>{S.saved=sv?S.saved.filter(x=>x!==n.id):[...S.saved,n.id];save();renderFelsefe()};
  el.querySelector("[data-more]").onclick=()=>askClaude(n.ask);
}

/* ---------- bilim ---------- */
const C=DATA.bilim,byId=Object.fromEntries(C.map(c=>[c.id,c])),STEPS=DATA.steps;
function grade(id,ok){
  const r=S.srs[id]||{step:0};
  r.step=ok?Math.min(r.step+1,STEPS.length):0;
  r.due=addDays(TODAY,ok?STEPS[r.step-1]:1);r.last=TODAY;S.srs[id]=r;save();
}
function todayQueue(){
  if(!DAY.q){
    const due=C.filter(c=>S.srs[c.id]&&S.srs[c.id].due<=TODAY)
      .sort((a,b)=>S.srs[a.id].due<S.srs[b.id].due?-1:1).slice(0,4).map(c=>c.id);
    const nw=C.find(c=>!S.srs[c.id]);
    DAY.q=nw?[...due,nw.id]:due;DAY.i=0;save();
  }
  return DAY.q.filter(id=>byId[id]);
}
function showCard(el,c,kicker,onGrade){
  const myth=c.kind==="myth",isNew=!S.srs[c.id];
  el.innerHTML=`<div class="kick">${kicker} · ${c.secn}${isNew?' · <span class="new">yeni</span>':""}</div>
  ${myth?'<span class="tag">İddia</span>':""}<h2>${c.front}</h2>
  ${myth?'<p class="muted mini">Sence doğru mu? Önce tahmin et, sonra çevir.</p>':""}
  <div class="back" hidden>${!myth&&c.title?`<div class="muted mini">${c.title}</div>`:""}
    <p>${c.back}</p><div class="label">Kanıt: ${c.label}</div>${c.src?`<div class="src">${c.src}</div>`:""}
    <div class="row"><button class="btn bad" data-g="0">${myth?"Yanıldım":"Bilemedim"}</button>
    <button class="btn good" data-g="1">Bildim</button></div>
    <div class="row"><button class="chip" data-more>Daha fazla ↗</button></div></div>
  <div class="row showrow"><button class="btn" data-show>Çevir</button></div>`;
  el.querySelector("[data-show]").onclick=()=>{el.querySelector(".back").hidden=false;el.querySelector(".showrow").hidden=true};
  el.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>onGrade(b.dataset.g==="1"));
  el.querySelector("[data-more]").onclick=()=>askClaude(c.ask);
}
function renderBilim(){
  const el=$("#bilim"),q=todayQueue(),i=DAY.i||0;
  if(!q.length){el.innerHTML='<div class="kick">Bilim kartları</div><p class="muted">Bugün kart yok.</p>';return}
  if(i>=q.length){el.innerHTML=`<div class="kick">Bilim kartları · ${q.length}/${q.length}</div><p>Bugünkü kartlar bitti ✓ Fazlası için Konular.${freshCards().length?` 🆕 ${freshCards().length} yeni kart orada.`:""}</p>`;return}
  showCard(el,byId[q[i]],`Bilim kartı ${i+1}/${q.length}`,ok=>{grade(q[i],ok);DAY.i=i+1;save();renderBilim();checkDone()});
}

/* ---------- brain ---------- */
function renderBrain(){
  const B=DATA.brain,el=$("#brain");let h='<div class="kick">Brain bugün</div>';
  if(B.digest&&B.digest.items.length)h+=`<h3>AI özeti <span class="muted">· ${fmtDate(B.digest.date)}</span></h3><ul>${B.digest.items.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  const cut=new Date(Date.now()-2*3600e3),ck=dkey(cut)+" "+z(cut.getHours())+":"+z(cut.getMinutes());
  const ev=B.luma.filter(e=>e.when.slice(0,10)>=TODAY&&(e.when.length<16||e.when>=ck)).slice(0,6);
  if(ev.length)h+=`<h3>Etkinlikler <span class="muted">· önümüzdeki günler</span></h3><ul class="ev">${ev.map(e=>
    `<li><span class="when">${fmtWhen(e.when)}</span> ${e.lane} ${e.event}<div class="muted mini">${e.where} · ${e.status}</div></li>`).join("")}</ul>`;
  if(B.radar&&B.radar.picks.length)h+=`<h3>GitHub radarı <span class="muted">· ${B.radar.week}</span></h3><ul>${B.radar.picks.map(p=>
    `<li><a href="${p.url}" target="_blank" rel="noopener">${p.name}</a> <span class="muted mini">· ${p.verdict}</span></li>`).join("")}</ul>`;
  el.innerHTML=h;
  if(B.digest&&B.digest.date<TODAY){const s=$("#stale");s.hidden=false;
    s.textContent=`Özet ${fmtDate(B.digest.date)} tarihli. Bugünkü güncelleme henüz gelmedi (Mac kapalı olabilir).`}
}
function checkDone(){const q=todayQueue();$("#done").hidden=!(DAY.f&&(DAY.i||0)>=q.length)}

/* ---------- konular ---------- */
function freshCards(){const cut=dkey(new Date(Date.now()-DATA.newDays*864e5));
  return C.filter(c=>c.added>cut).sort((a,b)=>a.added<b.added?1:-1)}
function renderKonular(){
  const el=$("#v-konular"),fr=freshCards();
  el.innerHTML=(fr.length?`<button class="shelf" data-s="__yeni"><b>🆕 Yeni eklenenler</b><span class="muted mini">${fr.length} kart · son ${DATA.newDays} gün</span></button>`:"")
    +DATA.sections.map(s=>{const cs=C.filter(c=>c.sec===s.id),seen=cs.filter(c=>S.srs[c.id]).length;
    return `<button class="shelf" data-s="${s.id}"><b>${s.name}</b><span class="muted mini">${cs.length} kart · ${seen} görüldü</span></button>`}).join("")
    +'<article class="card" id="study" hidden></article>';
  el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>study(b.dataset.s));
}
function study(sid){
  const cs=sid==="__yeni"?freshCards():C.filter(c=>c.sec===sid),st=$("#study");let i=0;st.hidden=false;
  const next=()=>{if(i>=cs.length){st.innerHTML='<p>Bu rafın sonu ✓</p>';return}
    showCard(st,cs[i],`Kart ${i+1}/${cs.length}`,ok=>{grade(cs[i].id,ok);i++;next()})};
  next();st.scrollIntoView({behavior:"smooth"});
}

/* ---------- kayıtlar + yedek ---------- */
function renderKayit(){
  const el=$("#v-kayit"),ns=S.saved.map(id=>F.find(n=>n.id===id)).filter(Boolean);
  el.innerHTML=ns.length?ns.map(n=>`<article class="card"><div class="kick">${n.thinker}</div>${noteHTML(n)}
    <div class="row"><button class="chip" data-un="${n.id}">Kaldır</button></div></article>`).join("")
    :'<p class="muted">Kaydettiğin felsefe notları burada durur.</p>';
  el.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{S.saved=S.saved.filter(x=>x!==b.dataset.un);save();renderKayit()});
}
$("#exp").onclick=()=>{const t=JSON.stringify({app:"bugun",v:1,at:new Date().toISOString(),state:S});
  $("#io").value=t;try{navigator.clipboard.writeText(t);toast("Kopyalandı")}catch(e){toast("Metni elle kopyala")}};
$("#imp").onclick=()=>{try{const o=JSON.parse($("#io").value);if(!o.state)throw 0;
  localStorage.setItem(LS,JSON.stringify(o.state));location.reload()}catch(e){toast("Bu bir Bugün yedeği değil")}};

/* ---------- nav + boot ---------- */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  ["bugun","konular","kayit","yedek"].forEach(v=>$("#v-"+v).hidden=v!==b.dataset.v);
  if(b.dataset.v==="konular")renderKonular();if(b.dataset.v==="kayit")renderKayit();window.scrollTo(0,0)});
$("#today").textContent=new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"});
$("#stamp").textContent="Güncellendi: "+DATA.built;
renderFelsefe();renderBilim();renderBrain();checkDone();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
